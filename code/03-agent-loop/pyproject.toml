[project]
name = "agent-loop"
version = "0.1.0"
description = "A minimal ReAct agent loop with layered stop conditions — companion to Harness Engineering Post 03."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
