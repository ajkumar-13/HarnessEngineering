[project]
name = "verification-loop"
version = "0.1.0"
description = "A test-driven self-correction loop: generate, verify, retry to green — companion to Harness Engineering Post 11."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verification_loop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
