[project]
name = "parallel-agents"
version = "0.1.0"
description = "A file-based task board with atomic claiming for a leaderless agent swarm — companion to Harness Engineering Post 17."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
