[project]
name = "harness-plus"
version = "0.1.0"
description = "Build #2 — the minimal harness hardened with hooks, a sandbox, a sub-agent, an approval gate, and tracing. Companion to Harness Engineering Post 25."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_plus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
