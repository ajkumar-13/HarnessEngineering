<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-three-eras-title" aria-describedby="hrn-01-three-eras-desc">
<title id="hrn-01-three-eras-title">Each era widened the surface the engineer works on</title>
<desc id="hrn-01-three-eras-desc">A timeline from 2022 to 2026. Under the axis, three neutral era spans as Faros AI dates them, each with its bottleneck and its unit of work: prompt engineering, 2022 to 2023, phrasing, a message; context engineering, 2024 to 2025, information, a window; harness engineering, 2026, autonomy and control, a whole run. Above the axis, three dated flags: Anthropic's Building effective agents in December 2024, context engineering popularised in June 2025, and Trivedy's Agent = Model + Harness on 10 March 2026. The caption says each era kept the work of the one before.</desc>
<style>
