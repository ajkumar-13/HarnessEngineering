<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-same-model-gain-title" aria-describedby="hrn-03-same-model-gain-desc">
<title id="hrn-03-same-model-gain-title">Only the harness changed, and the score rose 13.7 points</title>
<desc id="hrn-03-same-model-gain-desc">Two rows on a resolve-rate axis from 40 to 80% on Terminal-Bench 2.0, for one model, gpt-5.2-codex. Both values are hollow cited marks. The default harness scores 52.8%, about 47 of 89 tasks, just outside the top 30; the tuned harness scores 66.5%, about 59 of 89 tasks, in the top 5. A dotted line carries 52.8% down to the second row, and a bracket over the first row marks the gain of 13.7 points, graded firm. The caption says every change was to the harness around the model.</desc>
