<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-04-exit-cost-title" aria-describedby="hrn-04-exit-cost-desc">
<title id="hrn-04-exit-cost-title">The later the exit fires, the more the stuck run costs</title>
<desc id="hrn-04-exit-cost-desc">A line chart of cumulative tokens, read plus written, against turn for one scripted doom loop with illustrative sizes. The curve is dashed and bends upward from 4,400 tokens on turn 1 to 132,000 on turn 12. Three gate-coloured diamonds mark where each exit stops the run: no progress, window of 3, on turn 5 at 34,000 tokens; the 40,000-token budget on turn 6 at 44,400; the iteration cap of 12 on turn 12 at 132,000. A dotted line marks the 40,000-token budget. Values computed by the post's snippets.</desc>
