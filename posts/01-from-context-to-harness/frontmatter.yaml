title: "01 · From context to harness — the third era"

description: >
  Applied large language model (LLM) work has moved through three eras. First the
  bottleneck was phrasing (prompt engineering); then it was information (context
  engineering); by 2026 it is autonomy and control: the machine you build around the model
  so it can run on its own.

