<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-component-map-title" aria-describedby="hrn-01-component-map-desc">
<title id="hrn-01-component-map-title">Eleven components around one loop</title>
<desc id="hrn-01-component-map-desc">The component map of a harness. At the centre, component 01, the loop: reason in the model colour, act in the act colour and observe in the state colour, joined clockwise. On the left, the four components that feed the model: 02 tools, 03 state, 04 context management, 05 memory, with an arrow into the loop labelled feed. On the right, the four that govern it: 06 verification, 07 hooks, 08 permissions, 11 observability, with an arrow into the loop labelled govern. A frame around everything carries the two at a larger scale: 09 orchestration and 10 long-horizon patterns. A legend names the four colours: model, act, state, gate.</desc>
