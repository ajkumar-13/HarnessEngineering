<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-prebuilt-custom-seam-title" aria-describedby="hrn-03-prebuilt-custom-seam-desc">
<title id="hrn-03-prebuilt-custom-seam-title">The SDK ships the mechanism; the team writes the policy</title>
<desc id="hrn-03-prebuilt-custom-seam-desc">Two columns of cards split by a dashed vertical seam. Left, prebuilt, the mechanism a tool or SDK ships: 02 tool dispatch, 07 hook system, 08 permission model, 01 loop, 04 context management, 11 trace format. Right, custom, the policy a team writes: the team's tools (02), the team's hooks (07), sandbox policy (08), a memory file (05), and evaluations, which are post 22 rather than a component. Arrows cross the seam from tool dispatch, the hook system and the permission model to their custom counterparts: same component, two owners.</desc>
