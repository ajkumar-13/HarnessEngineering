<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-history-resent-title" aria-describedby="hrn-02-history-resent-desc">
<title id="hrn-02-history-resent-title">Every call re-sends the whole history</title>
<desc id="hrn-02-history-resent-desc">Three columns, one per model call of a scripted run of the companion's loop: two tool calls, then an answer. Each column lists the request in the order sent: tools and system prompt, the same head every time, then the messages so far. Call 1 carries 1 message, the user's task; call 2 carries 3, adding the assistant's calculator tool_use and its tool_result; call 3 carries 5, adding the echo tool_use and its result. Under each column, the response the model returned: tool_use calculator, tool_use echo, the final answer. Arrows show each response appended to the next call's request. The model keeps nothing between calls.</desc>
<style>
