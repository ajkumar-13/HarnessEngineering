<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-04-no-progress-title" aria-describedby="hrn-04-no-progress-desc">
<title id="hrn-04-no-progress-title">Only the doom loop should stop</title>
<desc id="hrn-04-no-progress-desc">Four scripted traces as rows of turns, each cell the turn's observation. Doom loop, run_tests, returns 1 failed five times. Build poll, build_status, returns running, running, passed, then run_tests returns all passed. Long build, build_status, returns running five times, then passed. Healthy edits, edit_file on a new line each turn, returns ok five times. Marks under turn 3 show where each detector fires, window 3 unless noted: the calls-only fingerprint, a square, stops the doom loop, the build poll and the long build; with the observation folded in, a circle, the doom loop and the long build; with a window of 6 for build_status, a diamond, only the doom loop. Stopping the doom loop is drawn in the gate colour; the other stops are false positives, in red. No detector stops the healthy edits.</desc>
