<text x="40" y="48" class="t-title" data-w="654">Streaming starts a tool as soon as its call is complete</text>
<text x="40" y="76" class="t-subtitle" data-w="810">Schematic, no measured durations: two tool calls in one response, run one after another as the companion does.</text>
