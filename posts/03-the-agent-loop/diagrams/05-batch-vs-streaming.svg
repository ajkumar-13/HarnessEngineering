<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-05-batch-vs-streaming-title" aria-describedby="hrn-05-batch-vs-streaming-desc">
<title id="hrn-05-batch-vs-streaming-title">Streaming starts a tool as soon as its call is complete</title>
<desc id="hrn-05-batch-vs-streaming-desc">A schematic of one turn on one time axis, without numbers. The response holds narration, then tool call A, then tool call B, generated in that order and equally long in both lanes. Batch: tool A starts only after the last token of the response, and tool B after tool A, then the next call. Streaming: tool A starts as soon as call A's block is complete, while call B is still being generated; tool B starts when its own block is complete. The streaming lane reaches the next call earlier, and a bracket marks the time saved, which comes from the part of the response generated after call A.</desc>
