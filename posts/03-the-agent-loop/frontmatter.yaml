outcomes:
  - id: o1
    text: "Write the minimal reason, act, observe loop over a provider API, answering every `tool_use` block by id in one user message of results."
  - id: o2
    text: "Act on every `stop_reason` value, and take the final-answer exit on a terminal stop reason rather than on a missing tool call."
  - id: o3
    text: "Explain why the model is stateless, what the loop must carry and re-send on every turn, and what re-sending a growing history costs in tokens."
  - id: o4
    text: "Implement the four exits in order, size the cap and the budget from a run's token arithmetic, and detect no progress without killing a polling agent."
  - id: o5
    text: "Choose between batch and streaming turns, and say what streaming does and does not buy a loop."
