title: "03 - The agent loop: ReAct, control loops, and stopping"
summary: "A harness is a loop of reason, act and observe around a model that keeps nothing between calls. The engineering is in when it stops: a final answer read from the stop reason, an iteration cap, a budget, and no-progress detection."
