slug: 03-the-agent-loop
title: "03 · The agent loop — ReAct, control loops, and stopping"

description: >
  At its core, a harness is a loop: the model reasons, the harness runs the tool it asked
  for, feeds the result back, and calls the model again: reason → act → observe, repeated.
  The model itself is stateless; the loop is what carries the conversation forward.

