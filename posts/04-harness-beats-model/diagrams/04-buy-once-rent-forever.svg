<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-04-buy-once-rent-forever-title" aria-describedby="hrn-04-buy-once-rent-forever-desc">
<title id="hrn-04-buy-once-rent-forever-title">A fix is paid once; an upgrade is paid on every run</title>
<desc id="hrn-04-buy-once-rent-forever-desc">A line chart of extra spend, in units of C, one run's price today, against the number of runs from 0 to 1,000, with illustrative sizes. The harness fix is a flat dashed ink line at 1,000, paid once. The model upgrade, which triples the price per token, is a dashed blue line rising by 2 a run from 0 to 2,000. They cross at 500 runs, marked, which is 2.5 days at 200 runs a day. Computed by snippets/upgrade_cost.py.</desc>
