slug: 04-harness-beats-model
title: "04 · Why the harness beats the model — the evidence"

description: >
  The founding claim of harness engineering is that the machine around the model is a
  bigger performance lever than the model itself: the same model can succeed or fail on
  the same task depending only on its harness. This post states that claim carefully,
  grades the evidence for it in order of strength, says plainly what that evidence does
  not show, and turns it into a rule: before reaching for a bigger model, check whether
  the gap you are seeing is a harness gap.

