<text x="304" y="412" text-anchor="middle" class="t-label f-red-ink" data-w="183">doom loop, context anxiety</text>
<rect x="784" y="160" width="136" height="48" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="852" y="188" text-anchor="middle" class="t-label" data-w="81">final answer</text>
