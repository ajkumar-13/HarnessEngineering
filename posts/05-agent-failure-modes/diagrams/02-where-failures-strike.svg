      --hrn-on-fill: #14161A;
      --hrn-on-accent: #1A1A1A;
      --hrn-grid: rgba(241, 238, 232, 0.08);
      --hrn-rule: #6A6D74;
      --hrn-arrow: #9A9A94;
      --hrn-neutral-soft: #1C1E23;
      --hrn-blue: #5AA8E0;
