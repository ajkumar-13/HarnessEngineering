  .s-red { stroke: var(--hrn-red); }
  .s-surface { stroke: var(--hrn-surface); }
</style>
<defs>
<marker id="hrn-02-where-failures-strike-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="581">Where each failure shows, and where its fix sits</text>
<text x="40" y="76" class="t-subtitle" data-w="706">Red: where a mode shows. Purple: a gate where its fix installs. Green: state written before the run.</text>
<rect x="192" y="120" width="552" height="328" rx="8" class="w15 nofill s-red d-proj" data-fit="skip"/>
