<text x="108" y="284" text-anchor="middle" class="t-label" data-w="58">and plan</text>
<path d="M176,252 L397.09,196.73" class="flow" marker-end="url(#hrn-02-where-failures-strike-arrow)"/>
<text x="208" y="212" class="t-note" data-w="86">session start</text>
<text x="40" y="504" class="t-note" data-w="502">A mode shows at one stage; its fix often sits on the arrow before or after it.</text>
</svg>
