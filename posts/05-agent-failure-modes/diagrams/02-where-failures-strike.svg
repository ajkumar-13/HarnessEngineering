<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-where-failures-strike-title" aria-describedby="hrn-02-where-failures-strike-desc">
<title id="hrn-02-where-failures-strike-title">Where each failure shows, and where its fix sits</title>
<desc id="hrn-02-where-failures-strike-desc">The agent loop as three cards turning clockwise: reason in blue, act in orange, observe in green. Red tags mark where each failure mode shows: victory declaration and one-shotting at reason, destructive action at act, doom loop and context anxiety at observe as the loop turns, and silent drift as a dashed red frame around every turn. Purple diamonds mark where fixes install: verification on the exit arrow to the final answer, the no-progress check and then the deny-list hook on the arrow into act, and context management, a note without a gate, beside the arrow back to reason. A green card, memory file and plan, feeds reason at session start.</desc>
<style>
