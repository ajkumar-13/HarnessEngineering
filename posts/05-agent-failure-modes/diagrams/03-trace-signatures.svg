<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-trace-signatures-title" aria-describedby="hrn-03-trace-signatures-desc">
<title id="hrn-03-trace-signatures-title">The shape of a run names the mode</title>
<desc id="hrn-03-trace-signatures-desc">Five runs from the post's archive, one row each, turns left to right as chips. Victory declaration, run-02: read_file, then a final answer; the run ends completed and its check fails. One-shotting, run-07: read_file, one edit of 412 lines in red, a final answer; completed, check failed. Doom loop, run-04: read_file, then run_tests three times in red; stopped as no_progress. A poll, not a doom loop, run-05: make ci, then build_status three times with results queued and running, the third not run; stopped as no_progress all the same. Destructive action, run-06: read_file, rm -rf build/ in red, run_tests, a final answer; completed, check passed.</desc>
