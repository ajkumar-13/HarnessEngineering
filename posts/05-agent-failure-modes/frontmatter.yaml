title: "05 · Agent failure modes — victory declaration, context anxiety, doom loops"

description: >
  Autonomous agents do not fail randomly; they fail in a small set of recurring, nameable
  ways, each mapping to a harness component you can change. This post catalogues six:
  victory declaration, context anxiety, one-shotting, doom loops, silent drift, and
  destructive action.

