<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-tool-dispatch-title" aria-describedby="hrn-01-tool-dispatch-desc">
<title id="hrn-01-tool-dispatch-title">Validate, then execute; every outcome returns as a string</title>
<desc id="hrn-01-tool-dispatch-desc">The act step of the loop opened into the companion's dispatch, left to right: the model emits a tool_use block (blue); a purple gate validates its input against the schema; a purple gate checks the command against the deny-list of 12 patterns; an orange step runs the command and shapes the result with its exit status; a green tool_result goes back to the model as the next observation. Three calls stop at three places. The call with the key cmd instead of command is refused by the schema check and returns error: invalid input: $: missing required property 'command'; $: unexpected property 'cmd'. The call rm -rf / is blocked by the deny-list and returns blocked: command matches a deny-list rule (\brm\s+-[rf]). The call cat /tmp/nope runs and returns (exit 1) cat: /tmp/nope: No such file or directory. Only the third reached the runner.</desc>
<style>
