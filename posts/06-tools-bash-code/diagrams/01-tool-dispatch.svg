<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="696">Validate, then execute; every outcome returns as a string</text>
<text x="40" y="76" class="t-subtitle" data-w="651">The companion's dispatch() and bash tool, with three calls and the string each one returns.</text>
<rect x="40" y="152" width="144" height="88" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="56" y="184" class="t-head" data-w="51">model</text>
<text x="56" y="216" class="t-note" data-w="98">tool_use block</text>
<rect x="224" y="152" width="144" height="88" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="240" y="184" class="t-head" data-w="64">validate</text>
<text x="240" y="216" class="t-note" data-w="73">schema.py</text>
<rect x="408" y="152" width="144" height="88" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="424" y="184" class="t-head" data-w="72">deny-list</text>
<text x="424" y="216" class="t-note" data-w="77">12 patterns</text>
<rect x="592" y="152" width="144" height="88" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="608" y="184" class="t-head" data-w="86">run, shape</text>
<text x="608" y="216" class="t-note" data-w="70">exit status</text>
<rect x="776" y="152" width="144" height="88" rx="8" class="f-green-soft s-green-line w1"/>
<text x="792" y="184" class="t-head" data-w="89">tool_result</text>
<text x="792" y="216" class="t-note" data-w="79">observation</text>
<path d="M184,196 L221,196" class="flow" marker-end="url(#hrn-01-tool-dispatch-arrow)"/>
<path d="M368,196 L405,196" class="flow" marker-end="url(#hrn-01-tool-dispatch-arrow)"/>
<path d="M552,196 L589,196" class="flow" marker-end="url(#hrn-01-tool-dispatch-arrow)"/>
<path d="M736,196 L773,196" class="flow" marker-end="url(#hrn-01-tool-dispatch-arrow)"/>
<path d="M848,152 L848,120 L112,120 L112,149" class="flow" marker-end="url(#hrn-01-tool-dispatch-arrow)"/>
<text x="120" y="112" class="t-note" data-w="60">next turn</text>
<rect x="40" y="320" width="272" height="312" rx="8" class="f-red-soft s-red-line w1"/>
<text x="56" y="352" class="t-head" data-w="185">refused by the schema</text>
<text x="56" y="392" class="t-note" data-w="23">call</text>
<text x="56" y="416" class="t-code" data-w="112">{"cmd": "ls"}</text>
<text x="56" y="456" class="t-note" data-w="97">the loop reads</text>
<text x="56" y="480" class="t-code" data-w="180">error: invalid input:</text>
<text x="56" y="504" class="t-code" data-w="163">$: missing required</text>
<text x="56" y="528" class="t-code" data-w="163">property 'command';</text>
<text x="56" y="552" class="t-code" data-w="112">$: unexpected</text>
<text x="56" y="576" class="t-code" data-w="120">property 'cmd'</text>
<text x="56" y="612" class="t-note" data-w="127">runner reached: no</text>
<path d="M296,240 L296,317" class="s-red w15 nofill" marker-end="url(#hrn-01-tool-dispatch-arrow-red)"/>
<rect x="344" y="320" width="272" height="312" rx="8" class="f-red-soft s-red-line w1"/>
<text x="360" y="352" class="t-head" data-w="196">blocked by the deny-list</text>
<text x="360" y="392" class="t-note" data-w="23">call</text>
<text x="360" y="416" class="t-code" data-w="197">{"command": "rm -rf /"}</text>
<text x="360" y="456" class="t-note" data-w="97">the loop reads</text>
<text x="360" y="480" class="t-code" data-w="205">blocked: command matches</text>
<text x="360" y="504" class="t-code" data-w="137">a deny-list rule</text>
<text x="360" y="528" class="t-code" data-w="120">(\brm\s+-[rf])</text>
<text x="360" y="612" class="t-note" data-w="127">runner reached: no</text>
<path d="M480,240 L480,317" class="s-red w15 nofill" marker-end="url(#hrn-01-tool-dispatch-arrow-red)"/>
<rect x="648" y="320" width="272" height="312" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="664" y="352" class="t-head" data-w="160">ran, failed, reported</text>
<text x="664" y="392" class="t-note" data-w="23">call</text>
<text x="664" y="416" class="t-code" data-w="240">{"command": "cat /tmp/nope"}</text>
<text x="664" y="456" class="t-note" data-w="97">the loop reads</text>
<text x="664" y="480" class="t-code" data-w="205">(exit 1) cat: /tmp/nope:</text>
<text x="664" y="504" class="t-code" data-w="214">No such file or directory</text>
<text x="664" y="612" class="t-note" data-w="133">runner reached: yes</text>
<path d="M664,240 L664,317" class="s-orange w15 nofill" marker-end="url(#hrn-01-tool-dispatch-arrow-orange)"/>
<text x="40" y="684" class="t-note" data-w="539">A bad call is not a crash: each string is the tool_result the model reads next turn.</text>
</svg>
