<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d">
  <title id="t">Tool dispatch: validate the model's tool call against its schema before executing</title>
  <desc id="d">A left-to-right flow. The model emits a tool call. The harness looks it up and validates the input against the tool's schema — the contract. If the input is valid, the harness executes the tool and returns a tool result. If the input is invalid, the harness returns an error observation without running anything. Either way the observation goes back to the model on the next turn, so a bad tool call becomes a correctable error rather than a crash.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;}}
    .bg{fill:var(--ce-bg);}
    .title{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:21px;fill:var(--ce-ink);}
    .sub{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12.5px;fill:var(--ce-ink-muted);}
    .model{fill:var(--ce-surface);stroke:var(--ce-ink);stroke-width:1.5;}
    .chip{fill:var(--ce-surface);stroke:var(--ce-border);stroke-width:1.25;}
    .gate{fill:var(--ce-surface);stroke:var(--ce-primary);stroke-width:1.75;}
    .exec{fill:var(--ce-surface);stroke:var(--ce-accent);stroke-width:1.75;}
    .err{fill:var(--ce-alert);fill-opacity:0.12;stroke:var(--ce-alert);stroke-width:1.5;}
    .schema{fill:var(--ce-primary);fill-opacity:0.06;stroke:var(--ce-primary);stroke-width:1.25;stroke-dasharray:5 4;}
    .nT{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:12.5px;fill:var(--ce-ink);}
    .nS{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:10.5px;fill:var(--ce-ink-muted);}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:600;font-size:10.5px;fill:var(--ce-ink);}
    .arr{stroke:var(--ce-ink-muted);stroke-width:1.5;fill:none;}
    .ok{stroke:var(--ce-success);stroke-width:1.75;fill:none;}
    .bad{stroke:var(--ce-alert);stroke-width:1.75;fill:none;}
    .okT{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:11px;fill:var(--ce-success);}
    .badT{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:11px;fill:var(--ce-alert);}
    .ret{stroke:var(--ce-ink-muted);stroke-width:1.5;fill:none;stroke-dasharray:5 4;}
    .retT{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:11px;fill:var(--ce-ink-muted);}
    .foot{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:11.5px;fill:var(--ce-ink);}
  ]]></style>

  <rect class="bg" width="960" height="430"/>
  <text class="title" x="48" y="40">Tool dispatch — validate, then execute</text>
  <text class="sub"   x="48" y="62">The schema is the contract. Check the model's tool call against it before you run anything.</text>

  <!-- schema card (the contract) -->
  <rect class="schema" x="350" y="86" width="210" height="62" rx="10"/>
  <text class="nS" x="362" y="104" font-weight="700" fill="var(--ce-primary)">SCHEMA · the contract</text>
  <text class="mono" x="362" y="122">{ command: string,</text>
  <text class="mono" x="362" y="137">  required: [command] }</text>

  <!-- MODEL -->
  <rect class="model" x="48" y="196" width="120" height="60" rx="10"/>
  <text class="nT" x="108" y="222" text-anchor="middle">MODEL</text>
  <text class="nS" x="108" y="238" text-anchor="middle">emits a tool call</text>

  <line class="arr" x1="168" y1="226" x2="196" y2="226"/>
  <polygon points="202,226 194,222 194,230" fill="var(--ce-ink-muted)"/>

  <!-- tool_use chip -->
  <rect class="chip" x="204" y="200" width="128" height="52" rx="8"/>
  <text class="mono" x="216" y="222">tool_use</text>
  <text class="mono" x="216" y="238">{name, input}</text>

  <line class="arr" x1="332" y1="226" x2="360" y2="226"/>
  <polygon points="366,226 358,222 358,230" fill="var(--ce-ink-muted)"/>

  <!-- VALIDATE gate -->
  <rect class="gate" x="368" y="198" width="140" height="56" rx="10"/>
  <text class="nT" x="438" y="222" text-anchor="middle">VALIDATE</text>
  <text class="nS" x="438" y="238" text-anchor="middle">input vs schema</text>
  <line class="ret" x1="455" y1="148" x2="447" y2="196"/>

  <!-- valid branch -->
  <path class="ok" d="M508 212 L604 186"/>
  <polygon points="610,184 601,183 603,192" fill="var(--ce-success)"/>
  <text class="okT" x="536" y="182">valid ✓</text>
  <rect class="exec" x="612" y="164" width="150" height="50" rx="10"/>
  <text class="nT" x="687" y="185" text-anchor="middle">EXECUTE</text>
  <text class="nS" x="687" y="201" text-anchor="middle">run the tool → result</text>

  <!-- invalid branch -->
  <path class="bad" d="M508 240 L604 268"/>
  <polygon points="610,270 603,262 601,271" fill="var(--ce-alert)"/>
  <text class="badT" x="536" y="284">invalid ✗</text>
  <rect class="err" x="612" y="248" width="210" height="50" rx="10"/>
  <text class="nT" x="627" y="270">error observation</text>
  <text class="nS" x="627" y="286">not executed — sent back to fix</text>

  <!-- return path -->
  <path class="ret" d="M762 189 L884 189 L884 360 L108 360 L108 262"/>
  <polygon points="108,256 104,265 112,265" fill="var(--ce-ink-muted)"/>
  <text class="retT" x="430" y="352" text-anchor="middle">either way → returned to the model as the next observation</text>

  <rect x="48" y="378" width="864" height="34" rx="8" fill="var(--ce-accent)" fill-opacity="0.10" stroke="var(--ce-accent)" stroke-width="1"/>
  <text class="foot" x="64" y="399">A tool is a contract written in tokens. Validate the call, and a bad call becomes a correctable error — never a crash.</text>
</svg>
