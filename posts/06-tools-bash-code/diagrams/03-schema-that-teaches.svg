  .lead { fill: none; stroke: var(--hrn-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--hrn-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-purple-ink { fill: var(--hrn-purple-ink); }
  .f-purple-soft { fill: var(--hrn-purple-soft); }
  .f-red-ink { fill: var(--hrn-red-ink); }
  .s-purple { stroke: var(--hrn-purple); }
  .s-rule { stroke: var(--hrn-rule); }
</style>
<defs>
<marker id="hrn-03-schema-that-teaches-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="630">A schema that teaches, and one that only describes</text>
<text x="40" y="76" class="t-subtitle" data-w="658">Token sizes are tiktoken o200k_base estimates; the verdicts are the companion's validate().</text>
<rect x="40" y="120" width="424" height="432" rx="8" class="card"/>
<text x="56" y="152" class="t-head" data-w="119">only describes</text>
<text x="56" y="192" class="t-code" data-w="163">name: pytest_invoke</text>
<text x="56" y="216" class="t-code" data-w="257">description: "Invokes pytest."</text>
<text x="56" y="240" class="t-code" data-w="163">input: args: string</text>
<text x="56" y="288" class="t-note" data-w="259">the model must guess what args holds</text>
<text x="56" y="312" class="t-note" data-w="208">nothing says when not to call it</text>
<text x="56" y="336" class="t-note" data-w="212">nothing is required or forbidden</text>
<text x="56" y="360" class="t-note" data-w="175">a stray call reaches pytest</text>
<rect x="496" y="120" width="424" height="432" rx="8" class="card"/>
<text x="512" y="152" class="t-head" data-w="155">teaches judgement</text>
<text x="512" y="192" class="t-code" data-w="129">name: run_tests</text>
<circle cx="896" cy="188" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="896" y="193" text-anchor="middle" class="t-label" data-w="9">1</text>
</g>
<text x="512" y="216" class="t-code" data-w="103">description:</text>
<circle cx="896" cy="212" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="896" y="217" text-anchor="middle" class="t-label" data-w="9">2</text>
</g>
<text x="512" y="240" class="t-code" data-w="265">  "Run the suite and return the</text>
<text x="512" y="264" class="t-code" data-w="308">  failures. Use after any code edit.</text>
<text x="512" y="288" class="t-code" data-w="274">  Do NOT use to read a file: use</text>
<text x="512" y="312" class="t-code" data-w="146">  bash for that."</text>
<text x="512" y="336" class="t-code" data-w="188">path: string, required</text>
<circle cx="896" cy="332" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="896" y="337" text-anchor="middle" class="t-label" data-w="9">3</text>
</g>
<text x="512" y="360" class="t-code" data-w="265">scope: unit | integration | all</text>
<circle cx="896" cy="356" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="896" y="361" text-anchor="middle" class="t-label" data-w="9">3</text>
</g>
<text x="512" y="384" class="t-code" data-w="231">additionalProperties: false</text>
<circle cx="896" cy="380" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="896" y="385" text-anchor="middle" class="t-label" data-w="9">3</text>
</g>
<path d="M512,400 L904,400" class="s-rule w1 nofill d-ref"/>
<text x="512" y="416" class="t-note" data-w="269">at run time: errors returned as "error: ..."</text>
<circle cx="896" cy="408" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="896" y="413" text-anchor="middle" class="t-label" data-w="9">4</text>
</g>
<text x="56" y="464" class="t-code" data-w="197">{"scope": "everything"}</text>
<text x="56" y="488" class="t-label f-red-ink" data-w="183">valid: accepted as it stands</text>
<text x="56" y="520" class="t-note" data-w="235">about 39 tokens, read on every call</text>
<text x="512" y="464" class="t-code" data-w="197">{"scope": "everything"}</text>
<text x="512" y="488" class="t-label f-purple-ink" data-w="111">refused: 2 errors</text>
<text x="512" y="520" class="t-note" data-w="243">about 105 tokens, read on every call</text>
<text x="56" y="440" class="t-note" data-w="89">one stray call</text>
<text x="512" y="440" class="t-note" data-w="126">the same stray call</text>
<circle cx="64" cy="596" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="64" y="601" text-anchor="middle" class="t-label" data-w="9">1</text>
</g>
<text x="88" y="600" class="t-label" data-w="131">name for the action</text>
<circle cx="288" cy="596" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="288" y="601" text-anchor="middle" class="t-label" data-w="9">2</text>
</g>
<text x="312" y="600" class="t-label" data-w="146">describe for the caller</text>
<circle cx="512" cy="596" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="512" y="601" text-anchor="middle" class="t-label" data-w="9">3</text>
</g>
<text x="536" y="600" class="t-label" data-w="126">constrain the input</text>
<circle cx="736" cy="596" r="12" class="f-purple-soft s-purple w15"/>
<g data-grid="skip">
<text x="736" y="601" text-anchor="middle" class="t-label" data-w="9">4</text>
</g>
<text x="760" y="600" class="t-label" data-w="140">errors as information</text>
<text x="40" y="684" class="t-note" data-w="721">Every marked line prevents a misuse, and every line of the definition is tokens the model reads on each call.</text>
</svg>
