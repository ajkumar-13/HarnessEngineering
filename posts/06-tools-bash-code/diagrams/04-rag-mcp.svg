<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-04-rag-mcp-title" aria-describedby="hrn-04-rag-mcp-desc">
<title id="hrn-04-rag-mcp-title">A shorter menu chose the right tool three times as often</title>
<desc id="hrn-04-rag-mcp-desc">Two cited measurements from the RAG-MCP paper, drawn as hollow marks: with every MCP server description in the prompt, the model selected the right server in 13.62% of trials and read 2,133.84 prompt tokens on average; retrieving the best match first raised selection to 43.13%, 3.2 times as often, and cut the average prompt to 1,084.00 tokens, 49% fewer. Both marked cited, graded firm: one model, qwen-max-0125, on the web-search subset of MCPBench.</desc>
