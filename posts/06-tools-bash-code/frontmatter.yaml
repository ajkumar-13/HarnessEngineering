outcomes:
  - id: o1
    text: "Explain a tool call as a request on the wire, a `tool_use` block answered by a `tool_result` with its id, and say what the harness owns between the two."
  - id: o2
    text: "Argue for bash and code execution as general-purpose tools over a zoo of narrow ones, and name when a bespoke tool still wins."
  - id: o3
    text: "Design a tool schema that teaches the model when not to call it, and say what its definition costs on every call."
