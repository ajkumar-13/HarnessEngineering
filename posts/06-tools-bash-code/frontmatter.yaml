slug: 06-tools-bash-code
title: "06 · Tools as the agent's hands — bash, code, and schemas"

description: >
  Tools are the ACT step of the loop: the surface through which a model changes the world.
  The durable lesson of 2025–26 is counter-intuitive: instead of building a bespoke tool
  for every action, give the model a few general-purpose tools (above all bash and code
  execution) and let it compose them.

