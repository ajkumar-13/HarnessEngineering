<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-append-vs-swap-title" aria-describedby="hrn-02-append-vs-swap-desc">
<title id="hrn-02-append-vs-swap-title">Swapping the tool block throws the cache away</title>
<desc id="hrn-02-append-vs-swap-desc">A line chart of tokens reused from the prompt cache on each of six turns, for the same run built three ways. Eager loading, all 13 skill schemas in the tool block, reuses 0, then 1,427, 1,454, 1,480, 1,504 and 1,528, and is billed 2,681 token-equivalents. Swap, which rebuilds the tool block, reuses nothing on turns 1 to 5 and 506 on turn 6, billed 3,397. Append reuses 0, 405, 667, 693, 861 and 885, billed 1,489. Cache reads count 0.1 and writes 1.25 of the base rate. Illustrative counts from snippets/prefix_cache.py.</desc>
