<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d">
  <title id="t">MCP dispatch inside one loop turn: host, client, server</title>
  <desc id="d">Three columns. On the left, the host — the harness that runs the agent loop; the model emits a tool call and the host routes it. In the middle, the MCP client, one per server, which speaks JSON-RPC. On the right, the MCP server, a separate process or remote service that owns and runs the tool, such as search_docs or create_ticket. Two request arrows go left to right: the host routes the tool call to the client, and the client calls the server over a transport, stdio or HTTP. Two response arrows return right to left: the server returns the result to the client, and the client returns it to the host, where it becomes the model's next observation.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;}}
    .bg{fill:var(--ce-bg);}
    .title{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:21px;fill:var(--ce-ink);}
    .sub{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12.5px;fill:var(--ce-ink-muted);}
    .host{fill:var(--ce-primary);fill-opacity:0.05;stroke:var(--ce-primary);stroke-width:1.5;}
    .client{fill:var(--ce-surface);stroke:var(--ce-ink-muted);stroke-width:1.5;}
    .server{fill:var(--ce-accent);fill-opacity:0.06;stroke:var(--ce-accent);stroke-width:1.5;}
    .model{fill:var(--ce-surface);stroke:var(--ce-ink);stroke-width:1.5;}
    .colT{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:11px;fill:var(--ce-ink-muted);letter-spacing:0.06em;}
    .nT{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:13px;fill:var(--ce-ink);}
    .nS{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:11px;fill:var(--ce-ink-muted);}
    .step{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:11px;fill:var(--ce-ink);}
    .num{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:11px;fill:var(--ce-primary);}
    .numA{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:11px;fill:var(--ce-accent);}
    .req{stroke:var(--ce-primary);stroke-width:1.75;fill:none;}
    .res{stroke:var(--ce-ink-muted);stroke-width:1.5;fill:none;stroke-dasharray:5 4;}
    .chip{fill:var(--ce-surface);stroke:var(--ce-accent);stroke-width:1.25;}
    .chipT{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:600;font-size:10.5px;fill:var(--ce-ink);}
    .trans{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:600;font-size:10px;fill:var(--ce-ink-muted);}
    .foot{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:11.5px;fill:var(--ce-ink);}
  ]]></style>

  <rect class="bg" width="960" height="430"/>
  <text class="title" x="48" y="40">MCP dispatch inside one loop turn</text>
  <text class="sub"   x="48" y="62">The harness is the host; a client speaks MCP to a server that owns the tool. One turn, six steps.</text>

  <!-- HOST -->
  <rect class="host" x="48" y="104" width="286" height="250" rx="12"/>
  <text class="colT" x="66" y="128">HOST · THE HARNESS</text>
  <rect class="model" x="66" y="140" width="250" height="44" rx="8"/>
  <text class="nT" x="191" y="160" text-anchor="middle">MODEL</text>
  <text class="nS" x="191" y="176" text-anchor="middle">runs the agent loop</text>
  <text class="num"  x="66" y="216">1</text><text class="step" x="80" y="216">model emits a tool call</text>
  <text class="num"  x="66" y="238">2</text><text class="step" x="80" y="238">route it to the matching client</text>
  <text class="numA" x="66" y="316">6</text><text class="step" x="80" y="316">result → next observation →</text>
  <text class="nS"   x="80" y="332">back to the loop</text>

  <!-- CLIENT -->
  <rect class="client" x="398" y="150" width="164" height="150" rx="12"/>
  <text class="colT" x="480" y="180" text-anchor="middle">MCP CLIENT</text>
  <text class="nS"   x="480" y="202" text-anchor="middle">one per server</text>
  <text class="nS"   x="480" y="220" text-anchor="middle">speaks JSON-RPC</text>

  <!-- SERVER -->
  <rect class="server" x="626" y="104" width="286" height="250" rx="12"/>
  <text class="colT" x="644" y="128">MCP SERVER · SEPARATE PROCESS / REMOTE</text>
  <text class="nT" x="644" y="156">Owns &amp; runs the tool</text>
  <rect class="chip" x="644" y="170" width="128" height="26" rx="6"/><text class="chipT" x="708" y="187" text-anchor="middle">search_docs</text>
  <rect class="chip" x="782" y="170" width="120" height="26" rx="6"/><text class="chipT" x="842" y="187" text-anchor="middle">create_ticket</text>
  <text class="numA" x="644" y="238">4</text><text class="step" x="658" y="238">executes the requested tool</text>

  <!-- request arrows -->
  <line class="req" x1="334" y1="200" x2="392" y2="200"/>
  <polygon points="398,200 390,196 390,204" fill="var(--ce-primary)"/>
  <text class="num" x="352" y="192">2 →</text>
  <line class="req" x1="562" y1="200" x2="620" y2="200"/>
  <polygon points="626,200 618,196 618,204" fill="var(--ce-primary)"/>
  <text class="num" x="576" y="192">3 →</text>
  <text class="trans" x="591" y="216" text-anchor="middle">stdio · HTTP</text>

  <!-- response arrows -->
  <line class="res" x1="620" y1="264" x2="562" y2="264"/>
  <polygon points="556,264 564,260 564,268" fill="var(--ce-ink-muted)"/>
  <text class="trans" x="591" y="282" text-anchor="middle">5 ←</text>
  <line class="res" x1="392" y1="264" x2="334" y2="264"/>
  <polygon points="328,264 336,260 336,268" fill="var(--ce-ink-muted)"/>
  <text class="trans" x="363" y="282" text-anchor="middle">5 ←</text>

  <text class="foot" x="48" y="392">5–6 · the result returns the same path — server → client → host — and becomes the model's next observation.</text>
  <text class="sub"  x="48" y="412">A server is a separate process, so its tools never touch the window until called — and the same server works with any host.</text>
</svg>
