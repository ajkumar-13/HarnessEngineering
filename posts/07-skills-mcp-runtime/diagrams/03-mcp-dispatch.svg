<rect x="648" y="160" width="240" height="48" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="768" y="188" text-anchor="middle" class="t-label" data-w="137">3  create_ticket runs</text>
<path d="M392,172 L645,172" class="flow" marker-end="url(#hrn-03-mcp-dispatch-arrow)"/>
<text x="532" y="164" class="t-label" data-w="78">2  tools/call</text>
<path d="M648,200 L395,200" class="flow" marker-end="url(#hrn-03-mcp-dispatch-arrow)"/>
<text x="532" y="224" class="t-label" data-w="54">4  result</text>
<text x="552" y="268" class="t-note" data-w="120">the request frame</text>
<text x="552" y="292" class="t-code" data-w="231">{"jsonrpc": "2.0", "id": 1,</text>
<text x="568" y="316" class="t-code" data-w="197">"method": "tools/call",</text>
<text x="568" y="340" class="t-code" data-w="299">"params": {"name": "create_ticket",</text>
<text x="584" y="364" class="t-code" data-w="308">"arguments": {...}, "_meta": {...}}}</text>
<text x="552" y="400" class="t-note" data-w="64">the result</text>
<text x="552" y="424" class="t-code" data-w="248">"text": "TICKET-4417 created"</text>
<path d="M324,208 L324,277" class="flow" marker-end="url(#hrn-03-mcp-dispatch-arrow)"/>
<g data-grid="skip">
<path d="M324,236.8 L331.2,244 L324,251.2 L316.8,244 Z" class="f-purple s-surface w1"/>
</g>
<text x="340" y="248" class="t-label f-purple-ink" data-w="69">5  validate</text>
<rect x="256" y="280" width="136" height="48" rx="8" class="f-green-soft s-green-line w1"/>
<text x="324" y="308" text-anchor="middle" class="t-label" data-w="79">observation</text>
<path d="M256,304 L136,304 L136,211" class="flow" marker-end="url(#hrn-03-mcp-dispatch-arrow)"/>
<text x="152" y="296" class="t-label" data-w="76">6  next turn</text>
<rect x="72" y="368" width="352" height="56" rx="8" class="f-red-soft s-red-line w1"/>
<text x="88" y="392" class="t-label f-red-ink" data-w="164">timeout or wrong shape:</text>
<text x="88" y="412" class="t-label f-red-ink" data-w="219">an error observation, not a crash</text>
<text x="40" y="504" class="t-note" data-w="545">Only the result crosses back, and the harness checks it before the model reads it.</text>
</svg>
