<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-mcp-dispatch-title" aria-describedby="hrn-03-mcp-dispatch-desc">
<title id="hrn-03-mcp-dispatch-title">An MCP call crosses a process boundary and back</title>
<desc id="hrn-03-mcp-dispatch-desc">One loop turn in six steps. In the host, which is the harness, the model emits a tool call (1) to the MCP client, which sends a JSON-RPC tools/call request for create_ticket (2) across the process boundary over stdio or HTTP. In the server process the tool runs (3) and the result returns (4). Back in the host the result passes a validation gate (5) and becomes the next observation for the model (6). A timeout or a result of the wrong shape becomes an error observation instead of a crash. The request frame is shown as code.</desc>
