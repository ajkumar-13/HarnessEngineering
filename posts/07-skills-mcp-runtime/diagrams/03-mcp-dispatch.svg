<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="616">An MCP call crosses a process boundary and back</text>
<text x="40" y="76" class="t-subtitle" data-w="651">Host side in full; the server only runs the tool. Frame printed by snippets/mcp_dispatch.py.</text>
<rect x="40" y="104" width="416" height="352" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="56" y="132" class="t-head" data-w="143">host: the harness</text>
