slug: 07-skills-mcp-runtime
title: "07 · Skills & MCP in the runtime"

description: >
  Post 06 argued for a few general tools, yet real agents still need dozens of specific
  capabilities: parse PDFs, query a database, file a ticket. The runtime answer is not to
  load all their schemas at once; it is progressive disclosure, keeping a large catalogue
  of skills dormant on disk and loading a skill's tools.

