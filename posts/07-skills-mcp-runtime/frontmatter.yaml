outcomes:
  - id: o1
    text: "Describe a skill as a loadable procedure and say which of its parts load at each level of disclosure."
  - id: o2
    text: "Work out what an over-stuffed tool list costs per run, and use the published thresholds to decide whether a catalogue needs on-demand loading."
  - id: o3
    text: "Implement progressive disclosure with a skill registry that matches triggers on whole words and initialises each skill once."
  - id: o4
    text: "Show with token counts that appending discovered schemas keeps the cached prefix and swapping them destroys it."
  - id: o5
    text: "Trace an MCP tool call from model to client to server and back inside the act step, validating the result and treating failure as an observation."
  - id: o6
    text: "Choose a general tool, a skill or an MCP server by what each keeps out of the window and the process, and keep results out as well."
