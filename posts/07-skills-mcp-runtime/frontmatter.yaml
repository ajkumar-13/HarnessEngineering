title: "07 - Skills and MCP in the runtime"
summary: "Progressive disclosure keeps a catalogue of skills on disk and loads a skill's tools only when a task needs them; MCP moves a tool's code into another process. Appending discovered schemas, never swapping them, keeps the prompt cache."
