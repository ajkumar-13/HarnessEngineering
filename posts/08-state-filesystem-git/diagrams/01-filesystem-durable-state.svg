<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-filesystem-durable-state-title" aria-describedby="hrn-01-filesystem-durable-state-desc">
<title id="hrn-01-filesystem-durable-state-title">The loop thinks in the window; its state lives on disk</title>
<desc id="hrn-01-filesystem-durable-state-desc">Two regions. On the left, a neutral frame for the context window holds the agent loop: reason in blue, act in orange, observe in green, turning clockwise; the window is re-sent on every call and wiped at a reset. On the right, a green frame for disk holds four files, plan.md rewritten each step, scratch/build.log the offloaded output, output.json the artefact, and handoff.md which survives a reset, and a git history of two checkpoints and a bad step in red, with an arrow resetting the bad step to the last checkpoint. An arrow from the window to disk reads write, offload; one back reads read on demand.</desc>
