<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-checkpoint-rollback-title" aria-describedby="hrn-02-checkpoint-rollback-desc">
<title id="hrn-02-checkpoint-rollback-title">A rollback restores only what the step could touch</title>
<desc id="hrn-02-checkpoint-rollback-desc">Three cards left to right: checkpoint 240d0e4 with tests green, a risky step in red with tests red, and after the rollback HEAD back at 240d0e4. A table of four paths: src/parse.py restored because it is tracked; src/debris.py removed, untracked under src/; scratch/build.log kept because it is ignored; notes.md kept, untracked outside the paths. Below, in red, a checkpoint that fails on a leftover index.lock while rev-parse HEAD still answers 240d0e4.</desc>
