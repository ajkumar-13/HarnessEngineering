    --hrn-neutral-2: #CFCFC8;
    --hrn-neutral-3: #8E8E88;
    --hrn-on-fill: #FFFDF9;
    --hrn-on-accent: #1A1A1A;
    --hrn-grid: rgba(26, 26, 26, 0.06);
    --hrn-rule: #8E8E88;
    --hrn-arrow: #6E6E68;
    --hrn-neutral-soft: #F2F2EE;
    --hrn-blue: #0072B2;
    --hrn-blue-ink: #005A8C;
    --hrn-blue-soft: #E3F0F8;
    --hrn-blue-line: #9CC6E0;
    --hrn-orange: #C98500;
    --hrn-orange-ink: #8A5B00;
    --hrn-orange-soft: #FBF0D9;
    --hrn-orange-line: #E5C27A;
    --hrn-green: #008F68;
    --hrn-green-ink: #006B4E;
    --hrn-green-soft: #DFF3EC;
    --hrn-green-line: #8FCDB8;
    --hrn-red: #A8322A;
    --hrn-red-ink: #8F2A23;
    --hrn-red-soft: #F8E3E1;
    --hrn-red-line: #DDA49F;
    --hrn-purple: #A14D8C;
    --hrn-purple-ink: #833E72;
    --hrn-purple-soft: #F4E4EF;
    --hrn-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --hrn-bg: #0E0F12;
      --hrn-surface: #16181C;
      --hrn-ink: #F2F2EE;
      --hrn-ink-muted: #B4B4AE;
      --hrn-ink-subtle: #6E6E68;
      --hrn-border: #2A2D33;
      --hrn-primary: #8BA8E0;
      --hrn-accent: #E8B088;
      --hrn-success: #7FBF9B;
      --hrn-warn: #D4B58A;
      --hrn-alert: #D88880;
      --hrn-neutral-1: #1F2229;
      --hrn-neutral-2: #2C3038;
      --hrn-neutral-3: #6E6E68;
      --hrn-on-fill: #14161A;
      --hrn-on-accent: #1A1A1A;
      --hrn-grid: rgba(241, 238, 232, 0.08);
      --hrn-rule: #6A6D74;
      --hrn-arrow: #9A9A94;
      --hrn-neutral-soft: #1C1E23;
      --hrn-blue: #5AA8E0;
      --hrn-blue-ink: #7DBBE8;
      --hrn-blue-soft: #14283A;
      --hrn-blue-line: #2E5878;
      --hrn-orange: #E8B040;
      --hrn-orange-ink: #F0C060;
      --hrn-orange-soft: #33260F;
      --hrn-orange-line: #6E5222;
      --hrn-green: #3CC497;
      --hrn-green-ink: #62D1AC;
      --hrn-green-soft: #10302A;
      --hrn-green-line: #2A6A55;
      --hrn-red: #E8796E;
      --hrn-red-ink: #F09A90;
      --hrn-red-soft: #3A1A18;
      --hrn-red-line: #7A3A34;
      --hrn-purple: #D58CC4;
      --hrn-purple-ink: #E2A6D3;
      --hrn-purple-soft: #331F2E;
      --hrn-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--hrn-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--hrn-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--hrn-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--hrn-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--hrn-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--hrn-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--hrn-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--hrn-surface); stroke: var(--hrn-rule); stroke-width: 1; }
  .card { fill: var(--hrn-neutral-soft); stroke: var(--hrn-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--hrn-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--hrn-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--hrn-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--hrn-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--hrn-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--hrn-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-soft { fill: var(--hrn-blue-soft); }
  .f-green-ink { fill: var(--hrn-green-ink); }
  .f-green-soft { fill: var(--hrn-green-soft); }
  .f-orange-soft { fill: var(--hrn-orange-soft); }
  .f-purple-soft { fill: var(--hrn-purple-soft); }
  .f-red-ink { fill: var(--hrn-red-ink); }
  .f-red-soft { fill: var(--hrn-red-soft); }
  .s-blue-line { stroke: var(--hrn-blue-line); }
  .s-green-line { stroke: var(--hrn-green-line); }
  .s-orange-line { stroke: var(--hrn-orange-line); }
  .s-purple-line { stroke: var(--hrn-purple-line); }
  .s-red-line { stroke: var(--hrn-red-line); }
</style>
<defs>
<marker id="hrn-03-handoff-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="574">The handoff file carries the work across a reset</text>
<text x="40" y="76" class="t-subtitle" data-w="662">A run of handoff.py: session 1 is killed after an unverified commit; session 2 has only the file.</text>
<text x="40" y="124" class="t-head" data-w="77">session 1</text>
<rect x="40" y="144" width="288" height="40" rx="8" class="f-green-soft s-green-line w1"/>
<text x="56" y="168" class="t-label" data-w="222">checkpoint 3db0e43, 2 of 4 steps</text>
<rect x="40" y="196" width="288" height="40" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="56" y="224" class="t-label" data-w="114">write handoff.md</text>
<rect x="40" y="248" width="288" height="40" rx="8" class="f-red-soft s-red-line w1"/>
<text x="56" y="272" class="t-label" data-w="186">commit 050bacd, unverified</text>
<rect x="40" y="300" width="288" height="40" rx="8" class="f-red-soft s-red-line w1"/>
<text x="56" y="328" class="t-label" data-w="136">killed: memory gone</text>
<text x="40" y="368" class="t-label f-red-ink" data-w="175">window wiped at the reset</text>
<text x="632" y="124" class="t-head" data-w="77">session 2</text>
<rect x="632" y="144" width="288" height="40" rx="8" class="f-green-soft s-green-line w1"/>
<text x="648" y="168" class="t-label" data-w="178">read handoff.md: 3db0e43</text>
<rect x="632" y="196" width="288" height="40" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="648" y="224" class="t-label" data-w="188">HEAD is 050bacd: no match</text>
<rect x="632" y="248" width="288" height="40" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="648" y="272" class="t-label" data-w="133">rollback to 3db0e43</text>
<rect x="632" y="300" width="288" height="40" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="648" y="328" class="t-label" data-w="113">resume at step 3</text>
<rect x="632" y="352" width="288" height="40" rx="8" class="f-green-soft s-green-line w1"/>
<text x="648" y="376" class="t-label" data-w="181">checkpoint 4a5e5bd, 4 of 4</text>
<rect x="360" y="144" width="240" height="264" rx="8" class="f-green-soft s-green-line w1"/>
<text x="376" y="172" class="t-code" data-w="86">handoff.md</text>
<text x="376" y="204" class="t-code" data-w="60">## Spec</text>
<text x="376" y="224" class="t-note" data-w="138">the goal, unchanged</text>
<text x="376" y="252" class="t-code" data-w="60">## Done</text>
<text x="376" y="272" class="t-note" data-w="132">2 of 4 steps verified</text>
<text x="376" y="300" class="t-code" data-w="60">## Next</text>
<text x="376" y="320" class="t-note" data-w="153">multiline quoted fields;</text>
<text x="376" y="340" class="t-note" data-w="120">negative amounts</text>
<text x="376" y="368" class="t-code" data-w="69">## State</text>
<text x="376" y="388" class="t-note" data-w="164">last checkpoint 3db0e43</text>
<text x="480" y="436" text-anchor="middle" class="t-label f-green-ink" data-w="175">on disk: survives the reset</text>
<path d="M328,216 L357,216" class="flow" marker-end="url(#hrn-03-handoff-lifecycle-arrow)"/>
<path d="M600,164 L629,164" class="flow" marker-end="url(#hrn-03-handoff-lifecycle-arrow)"/>
<text x="40" y="504" class="t-note" data-w="500">The State field lets the fresh session check the tree before it trusts the file.</text>
</svg>
