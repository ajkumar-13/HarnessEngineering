<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-handoff-lifecycle-title" aria-describedby="hrn-03-handoff-lifecycle-desc">
<title id="hrn-03-handoff-lifecycle-title">The handoff file carries the work across a reset</title>
<desc id="hrn-03-handoff-lifecycle-desc">Three columns. Session 1: checkpoint 3db0e43 after 2 of 4 steps, write handoff.md, commit 050bacd unverified, killed; its window is wiped at the reset. In the middle, handoff.md on disk: Spec, the goal; Done, 2 of 4 steps verified; Next, multiline quoted fields then negative amounts; State, last checkpoint 3db0e43. Session 2 reads only the file: it names 3db0e43 but HEAD is 050bacd, so it rolls back to 3db0e43, resumes at step 3, and checkpoints 4a5e5bd with 4 of 4 steps.</desc>
<style>
  :root {
    --hrn-bg: #FAFAF7;
    --hrn-surface: #FFFFFF;
    --hrn-ink: #1A1A1A;
    --hrn-ink-muted: #5C5C5C;
    --hrn-ink-subtle: #9A9A9A;
    --hrn-border: #D9D9D4;
    --hrn-primary: #5B7FBF;
    --hrn-accent: #D98E5F;
