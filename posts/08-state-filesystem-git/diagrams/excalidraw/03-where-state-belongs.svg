<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Which state belongs in the window, which belongs on disk, and the two mistakes</title>
  <desc id="d">A hand-drawn figure split by a dashed line. On the left, state needed this turn and every turn, which belongs in the window: the task and the current step of the plan, since that is what the model is reasoning about right now; the last tool result it is acting on, the observation that decides the next move; the rules that apply on every turn, meaning a short memory file injected each session; and a pointer to everything else, being a path and one line saying what is in it. On the right, state needed later or only sometimes, which belongs on disk: the full plan and the scratchpad, re-read when the thread slips; big tool output such as a build log, with only a pointer left in the window; artefacts, meaning the actual product such as generated code, output.json or a report; and the handoff file carrying spec, done, next and state, the one file that survives a reset. Below, the two mirror-image mistakes: state in the window that should be on disk, such as a two-thousand-line log pasted into the transcript or a plan kept only in the conversation, which bloats the window and dies at the reset; and state on disk that should be in the window, such as a fact the model needs every turn hidden behind a file read, which makes the agent spend its turns on filesystem bookkeeping. Two further mistakes are noted: an unversioned working directory, since no git means no rollback, and an append-only notes file that never compacts, which recreates the window problem on disk.</desc>

