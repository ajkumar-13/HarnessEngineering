slug: 08-state-filesystem-git
title: "08 · State & the filesystem — durable memory and git as state"

description: >
  The model is stateless, and the window it reads each turn is volatile, expensive, and
  small relative to the work: smaller in practice than the number on the box, because
  accuracy falls well before the nominal limit. The filesystem is the opposite (effectively
  unbounded, durable, and cheap), which makes it the harness's natural extension of memory:
  a place to write plans, offload big tool outputs, and pass work between steps.

