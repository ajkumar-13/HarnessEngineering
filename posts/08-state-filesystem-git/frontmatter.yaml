outcomes:
  - id: o1
    text: "Decide whether a piece of state belongs in the window or on disk by when it is needed, and use the filesystem as scratchpad and inter-step bus."
  - id: o2
    text: "Work out what offloading one tool result saves a run, from its size, the turn it arrives and the iteration cap."
  - id: o3
    text: "Checkpoint after each verified step and roll back a bad one under git, with the commit's return code checked, staging filtered and the clean scoped."
  - id: o4
    text: "Write a handoff file that a fresh session can check and resume from, replace it atomically, and confirm that the write landed."
  - id: o5
    text: "Choose between a flat file, SQLite and an index from the access pattern, the number of writers, partial-write safety and review."
