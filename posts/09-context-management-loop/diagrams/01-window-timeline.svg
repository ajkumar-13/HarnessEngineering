<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-window-timeline-title" aria-describedby="hrn-01-window-timeline-desc">
<title id="hrn-01-window-timeline-title">A loop fills its own window; the ladder pushes back</title>
<desc id="hrn-01-window-timeline-desc">A line chart of input tokens sent on each model call, calls 2 to 141, of one generated run with illustrative sizes, both curves dashed. The unmanaged run, in muted ink, climbs in steps at each 2,000-line build log and passes the 200,000-token window at call 54 with 201,343 tokens, marked in red. The managed run, in ink, offloads the six build logs at the tool boundary before calls 10, 31, 52, 73, 94 and 115, marked with small triangles; clears spent tool results at call 97 and call 123 after crossing the soft trigger at 160,000 tokens; and compacts at call 138 on the hard trigger at 190,000, falling to 8,447 tokens. The triggers are purple dotted lines and the window a muted dotted line.</desc>
