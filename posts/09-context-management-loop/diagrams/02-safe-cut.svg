<text x="872" y="388" text-anchor="middle" class="t-code" data-w="43">tu_40</text>
<text x="40" y="436" class="t-note" data-w="655">The brief is a user turn of its own, so the roles still alternate: user, then the call that opens the tail.</text>
<text x="40" y="504" class="t-note" data-w="530">A cut by count orphans a result half the time; walking back to a call never does.</text>
