<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-break-even-title" aria-describedby="hrn-03-break-even-desc">
<title id="hrn-03-break-even-title">A deep compaction pays back fast; a shallow one barely</title>
<desc id="hrn-03-break-even-desc">A line chart of the net cost of one compaction of a 160,000-token session, in token-equivalents, against the number of later calls, both lines dashed and illustrative. The deep compaction, to 25,000 tokens, in ink, starts at 56,250 and falls by 13,500 a call, crossing zero after 4.2 calls, marked with a hollow circle. The shallow compaction, to 130,000 tokens, in muted ink, starts at 187,500 and falls by 3,000 a call, crossing zero after 62.5 calls, marked with a hollow square. A dotted line marks zero, break even.</desc>
