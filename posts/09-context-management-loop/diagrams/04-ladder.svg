<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-04-ladder-title" aria-describedby="hrn-04-ladder-desc">
<title id="hrn-04-ladder-title">Each rung up loses more and rewrites more of the cache</title>
<desc id="hrn-04-ladder-desc">Four cards stepping up from left to right, one per rung of the ladder, cheapest first. 1 offload, lossless: loses nothing; the cached message history is untouched at the tool boundary. 2 clear, nearly lossless: loses the raw bytes; the cache is broken from the first cleared result. 3 compact, lossy: loses what the brief drops; the cache is rewritten after the system prompt. 4 reset, total: loses all the handoff lacks; the cache starts over from the handoff.</desc>
<style>
