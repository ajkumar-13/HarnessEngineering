slug: 09-context-management-loop
title: "09 · Context management inside the loop — compaction, offloading, resets"

description: >
  A running agent fills its own window: every turn appends the model's output and the tool
  results, so left alone the window swells until quality degrades (context rot, now
  happening dynamically as the loop runs). A harness that means to run for more than a few
  turns must actively manage its own context.

