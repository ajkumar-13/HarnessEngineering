<marker id="hrn-01-ratchet-mechanism-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="566">One failure becomes three durable constraints</text>
<text x="40" y="76" class="t-subtitle" data-w="790">Osmani's worked example: the model reads the rule, a hook blocks the mistake, a reviewer catches what slips.</text>
<rect x="40" y="224" width="248" height="128" rx="8" class="f-red-soft s-red-line w1"/>
<text x="56" y="256" class="t-head f-red-ink" data-w="66">a failure</text>
<text x="56" y="288" class="t-label" data-w="136">a pull request with a</text>
<text x="56" y="312" class="t-label" data-w="137">commented-out test</text>
<text x="56" y="336" class="t-label" data-w="67">is merged</text>
<rect x="360" y="104" width="560" height="112" rx="8" class="f-green-soft s-green-line w1"/>
<text x="376" y="136" class="t-head f-green-ink" data-w="152">1  memory-file line</text>
<text x="904" y="136" text-anchor="end" class="t-note" data-w="178">read at every session start</text>
<text x="376" y="168" class="t-label" data-w="335">never comment out tests; delete them or fix them.</text>
<text x="376" y="192" class="t-note" data-w="103">in AGENTS.md</text>
<path d="M288,288 L358.53,162.61" class="flow" marker-end="url(#hrn-01-ratchet-mechanism-arrow)"/>
<rect x="360" y="232" width="560" height="112" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="376" y="264" class="t-head f-purple-ink" data-w="60">2  hook</text>
<text x="904" y="264" text-anchor="end" class="t-note" data-w="112">on every commit</text>
<text x="376" y="296" class="t-label" data-w="256">the pre-commit hook greps the diff for</text>
<text x="376" y="320" class="t-code" data-w="146">.skip(  and  xit(</text>
<path d="M288,288 L357,288" class="flow" marker-end="url(#hrn-01-ratchet-mechanism-arrow)"/>
<rect x="360" y="360" width="560" height="112" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="376" y="392" class="t-head f-purple-ink" data-w="141">3  reviewer check</text>
<text x="904" y="392" text-anchor="end" class="t-note" data-w="61">at review</text>
<text x="376" y="424" class="t-label" data-w="340">the reviewer sub-agent flags commented-out tests</text>
<text x="376" y="448" class="t-note" data-w="81">as a blocker</text>
<path d="M288,288 L358.53,413.39" class="flow" marker-end="url(#hrn-01-ratchet-mechanism-arrow)"/>
<text x="40" y="504" class="t-note" data-w="469">Not every failure earns all three; detectability and scope decide which.</text>
</svg>
