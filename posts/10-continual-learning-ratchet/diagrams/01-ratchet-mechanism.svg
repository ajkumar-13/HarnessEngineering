<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-ratchet-mechanism-title" aria-describedby="hrn-01-ratchet-mechanism-desc">
<title id="hrn-01-ratchet-mechanism-title">One failure becomes three durable constraints</title>
<desc id="hrn-01-ratchet-mechanism-desc">On the left a red card, a failure: a pull request with a commented-out test is merged. Three arrows fan out from it to three cards on the right, each acting at a different moment. One, in green, a memory-file line in AGENTS.md, read at every session start: never comment out tests; delete them or fix them. Two, in purple, a hook that acts on every commit: the pre-commit hook greps the diff for .skip( and xit(. Three, in purple, a reviewer check that acts at review: the reviewer sub-agent flags commented-out tests as a blocker.</desc>
