<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-ratchet-over-time-title" aria-describedby="hrn-03-ratchet-over-time-desc">
<title id="hrn-03-ratchet-over-time-title">With the file, each session fails only on its new task</title>
<desc id="hrn-03-ratchet-over-time-desc">Two panels computed by snippets/ratchet_demo.py over four sessions, each adding one task. Left, failed attempts per session: with the memory file 1, 1, 1 and 1; without it 1, 2, 3 and 4, 10 in all against 4. Right, rules read back at the start of each session with the file: 0, 1, 2 and 3, a staircase that only climbs.</desc>
