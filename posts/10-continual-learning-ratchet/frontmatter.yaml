outcomes:
  - id: o1
    text: "Keep a memory file that the harness reads at every session start, write each line so it can be enforced, and price what carrying it costs."
  - id: o2
    text: "Turn one failure into the ratchet's three teeth, a memory-file line, a hook and a reviewer check, and decide which of them the failure earns."
  - id: o3
    text: "Promote an observation to a rule only when it passes the three tests, with a reviewed root cause and a provenance note."
  - id: o4
    text: "Prune a memory file of obsolete, contradictory and redundant rules, and read a rule's hook firing rate after it lands."
  - id: o5
    text: "Run the companion's `Ratchet` and show the fix landing only after the rule exists, within one run and across sessions."
