<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-verification-gate-title" aria-describedby="hrn-01-verification-gate-desc">
<title id="hrn-01-verification-gate-title">A gate on the final answer turns done into verified</title>
<desc id="hrn-01-verification-gate-desc">Top: the loop, reason, act, observe, as one card, sends a candidate final answer, exit (1), into a purple verification gate. Pass leads to a card reading done, verified. Fail runs in red to a junction: while attempts remain, the failure report goes back into the loop as the next observation; when max_attempts=5 have failed, the run ends on a card reading unverified, flagged, rolled back or escalated. Bottom: the companion's demo, solve() over 7 is_prime cases. Attempt 1, all(n % d for d in range(2, n)), fails with is_prime(1,) == True, expected False; attempt 2, bounded by the square root, fails with the same report; attempt 3, guarded by n &gt; 1, passes all 7 cases, verified on attempt 3.</desc>
<style>
  :root {
    --hrn-bg: #FAFAF7;
    --hrn-surface: #FFFFFF;
    --hrn-ink: #1A1A1A;
    --hrn-ink-muted: #5C5C5C;
    --hrn-ink-subtle: #9A9A9A;
    --hrn-border: #D9D9D4;
    --hrn-primary: #5B7FBF;
    --hrn-accent: #D98E5F;
    --hrn-success: #5C9E78;
    --hrn-warn: #B8895A;
    --hrn-alert: #C66B5E;
    --hrn-neutral-1: #EAEAE4;
    --hrn-neutral-2: #CFCFC8;
    --hrn-neutral-3: #8E8E88;
    --hrn-on-fill: #FFFDF9;
    --hrn-on-accent: #1A1A1A;
    --hrn-grid: rgba(26, 26, 26, 0.06);
    --hrn-rule: #8E8E88;
    --hrn-arrow: #6E6E68;
    --hrn-neutral-soft: #F2F2EE;
    --hrn-blue: #0072B2;
    --hrn-blue-ink: #005A8C;
    --hrn-blue-soft: #E3F0F8;
    --hrn-blue-line: #9CC6E0;
    --hrn-orange: #C98500;
    --hrn-orange-ink: #8A5B00;
    --hrn-orange-soft: #FBF0D9;
    --hrn-orange-line: #E5C27A;
    --hrn-green: #008F68;
    --hrn-green-ink: #006B4E;
    --hrn-green-soft: #DFF3EC;
    --hrn-green-line: #8FCDB8;
    --hrn-red: #A8322A;
    --hrn-red-ink: #8F2A23;
    --hrn-red-soft: #F8E3E1;
    --hrn-red-line: #DDA49F;
    --hrn-purple: #A14D8C;
    --hrn-purple-ink: #833E72;
    --hrn-purple-soft: #F4E4EF;
    --hrn-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --hrn-bg: #0E0F12;
      --hrn-surface: #16181C;
      --hrn-ink: #F2F2EE;
      --hrn-ink-muted: #B4B4AE;
      --hrn-ink-subtle: #6E6E68;
      --hrn-border: #2A2D33;
      --hrn-primary: #8BA8E0;
      --hrn-accent: #E8B088;
      --hrn-success: #7FBF9B;
      --hrn-warn: #D4B58A;
      --hrn-alert: #D88880;
      --hrn-neutral-1: #1F2229;
      --hrn-neutral-2: #2C3038;
      --hrn-neutral-3: #6E6E68;
      --hrn-on-fill: #14161A;
      --hrn-on-accent: #1A1A1A;
      --hrn-grid: rgba(241, 238, 232, 0.08);
      --hrn-rule: #6A6D74;
      --hrn-arrow: #9A9A94;
      --hrn-neutral-soft: #1C1E23;
      --hrn-blue: #5AA8E0;
      --hrn-blue-ink: #7DBBE8;
      --hrn-blue-soft: #14283A;
      --hrn-blue-line: #2E5878;
      --hrn-orange: #E8B040;
      --hrn-orange-ink: #F0C060;
      --hrn-orange-soft: #33260F;
      --hrn-orange-line: #6E5222;
      --hrn-green: #3CC497;
      --hrn-green-ink: #62D1AC;
      --hrn-green-soft: #10302A;
      --hrn-green-line: #2A6A55;
      --hrn-red: #E8796E;
      --hrn-red-ink: #F09A90;
      --hrn-red-soft: #3A1A18;
      --hrn-red-line: #7A3A34;
      --hrn-purple: #D58CC4;
      --hrn-purple-ink: #E2A6D3;
      --hrn-purple-soft: #331F2E;
      --hrn-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--hrn-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--hrn-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--hrn-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--hrn-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--hrn-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--hrn-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--hrn-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--hrn-surface); stroke: var(--hrn-rule); stroke-width: 1; }
  .card { fill: var(--hrn-neutral-soft); stroke: var(--hrn-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--hrn-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--hrn-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--hrn-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--hrn-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--hrn-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--hrn-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-soft { fill: var(--hrn-blue-soft); }
  .f-purple { fill: var(--hrn-purple); }
  .f-purple-ink { fill: var(--hrn-purple-ink); }
  .f-purple-soft { fill: var(--hrn-purple-soft); }
  .f-red { fill: var(--hrn-red); }
  .f-red-ink { fill: var(--hrn-red-ink); }
  .s-blue-line { stroke: var(--hrn-blue-line); }
  .s-purple { stroke: var(--hrn-purple); }
  .s-purple-line { stroke: var(--hrn-purple-line); }
  .s-red { stroke: var(--hrn-red); }
  .s-surface { stroke: var(--hrn-surface); }
</style>
<defs>
<marker id="hrn-01-verification-gate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
<marker id="hrn-01-verification-gate-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-purple"/></marker>
<marker id="hrn-01-verification-gate-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-red"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="611">A gate on the final answer turns done into verified</text>
<text x="40" y="76" class="t-subtitle" data-w="707">Below, computed: the companion's solve() on its demo model, 7 is_prime cases, max_attempts=5.</text>
<rect x="40" y="120" width="208" height="80" rx="8" class="card"/>
<text x="56" y="152" class="t-head" data-w="67">the loop</text>
<text x="56" y="184" class="t-note" data-w="137">reason, act, observe</text>
<path d="M248,160 L413,160" class="flow" marker-end="url(#hrn-01-verification-gate-arrow)"/>
<text x="332" y="184" text-anchor="middle" class="t-note" data-w="121">candidate, exit (1)</text>
<path d="M432,145.6 L446.4,160 L432,174.4 L417.6,160 Z" class="f-purple s-surface w1"/>
<text x="432" y="132" text-anchor="middle" class="t-label f-purple-ink" data-w="108">verification gate</text>
<path d="M448,160 L581,160" class="s-purple w15 nofill" marker-end="url(#hrn-01-verification-gate-arrow-purple)"/>
<text x="516" y="148" text-anchor="middle" class="t-note f-purple-ink" data-w="32">pass</text>
<rect x="584" y="120" width="336" height="80" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="600" y="152" class="t-head" data-w="41">done</text>
<text x="600" y="184" class="t-note" data-w="185">verified, not merely claimed</text>
<path d="M432,176 L432,272" class="s-red w15 nofill"/>
<text x="444" y="212" class="t-label f-red-ink" data-w="20">fail</text>
<path d="M432,272 L581,272" class="s-purple w15 nofill" marker-end="url(#hrn-01-verification-gate-arrow-purple)"/>
<text x="508" y="260" text-anchor="middle" class="t-note f-purple-ink" data-w="114">5 attempts failed</text>
<rect x="584" y="232" width="336" height="80" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="600" y="264" class="t-head" data-w="82">unverified</text>
<text x="600" y="296" class="t-note" data-w="219">flagged, rolled back or escalated</text>
<path d="M432,272 L144,272" class="s-red w15 nofill"/>
<path d="M144,272 L144,203" class="s-red w15 nofill" marker-end="url(#hrn-01-verification-gate-arrow-red)"/>
<text x="160" y="300" class="t-label f-red-ink" data-w="317">attempts left: the report is the next observation</text>
<text x="40" y="368" class="t-head" data-w="172">The companion's run</text>
<text x="40" y="416" class="t-label" data-w="65">attempt 1</text>
<rect x="136" y="384" width="528" height="52" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="152" y="416" class="t-code" data-w="265">all(n % d for d in range(2, n))</text>
<path d="M696,398.4 L705.6,408 L696,417.6 L686.4,408 Z" class="f-purple s-surface w1"/>
<text x="720" y="416" class="t-label f-red-ink" data-w="20">fail</text>
<text x="152" y="460" class="t-code f-red-ink" data-w="308">is_prime(1,) == True, expected False</text>
<text x="40" y="512" class="t-label" data-w="65">attempt 2</text>
<rect x="136" y="480" width="528" height="52" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="152" y="512" class="t-code" data-w="385">all(n % d for d in range(2, int(n**0.5) + 1))</text>
<path d="M696,494.4 L705.6,504 L696,513.6 L686.4,504 Z" class="f-purple s-surface w1"/>
<text x="720" y="512" class="t-label f-red-ink" data-w="20">fail</text>
<text x="152" y="556" class="t-code f-red-ink" data-w="308">is_prime(1,) == True, expected False</text>
<text x="40" y="608" class="t-label" data-w="65">attempt 3</text>
<rect x="136" y="576" width="528" height="52" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="152" y="608" class="t-code" data-w="470">n &gt; 1 and all(n % d for d in range(2, int(n**0.5) + 1))</text>
<path d="M696,590.4 L705.6,600 L696,609.6 L686.4,600 Z" class="f-purple s-surface w1"/>
<text x="720" y="608" class="t-label f-purple-ink" data-w="110">pass: all 7 cases</text>
<text x="40" y="684" class="t-note" data-w="674">Attempt 2 changed the code and got the same report back; the report, not the code, is what repeats.</text>
</svg>
