<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-compounding-vs-failfast-title" aria-describedby="hrn-02-compounding-vs-failfast-desc">
<title id="hrn-02-compounding-vs-failfast-title">Without a gate, one early error costs 98% of the run</title>
<desc id="hrn-02-compounding-vs-failfast-desc">Two panels computed by the post's snippet on post 23's illustrative twelve-iteration run. Left, input tokens per iteration rise in a straight line from 6,000 at iteration 1 to 40,100 at iteration 12, with a reference line where the error enters, at iteration 2, and iterations 2 to 12 shaded red as forfeit without a gate. Right, input tokens forfeit on one scale: with no gate, caught at iteration 12, 270,600 of the run's 276,600; with a gate on every step, caught at iteration 2, 9,100.</desc>
