y="484.58" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11.5" fill="var(--ce-ink-muted)">A check slower than the work it guards will simply be skipped, and an author grading its own work is not a check at all.</text>
</svg>
