<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="t d">
  <title id="t">Five kinds of verifier ranked by strength, with cost and how often to run each</title>
  <desc id="d">A hand-drawn table of five verifiers, strongest first, with the cost of each, whether it can be wrong, and how often to run it. A compiler or type checker asks whether the code compiles and the types line up, costs nothing and seconds, cannot be wrong since it gives the same verdict every time, and should run on every step. A test suite asks whether the behaviour matches the tests, with tests the agent did not write being strongest of all; it costs seconds to minutes, is repeatable, and should run on every step or edit. Schema validation asks whether the result parses and satisfies the contract; it costs near nothing, either parses or does not, and should run on every structured result. A dashed line marks that below it the verifier can be wrong, so it is a signal rather than a gate. Below the line, an independent judge asks whether a summary is faithful or prose is clear, for what is not mechanically checkable; it costs a model call each time, can pass a bad answer, and belongs at real checkpoints. Last, the self-critique of the model itself is a useful first pass because finding problems and generating surface different things, but it costs a model call, skews positive, and is a first pass only. Captions record that the verifiers should be layered, cheap deterministic ones on every step and expensive ones at checkpoints, that a check slower than the work it guards will be skipped, and that an author grading its own work is not a check at all.</desc>

