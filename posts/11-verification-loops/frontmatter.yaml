outcomes:
  - id: o1
    text: "Gate the loop's final-answer exit on ground truth, choosing the cheapest verifier that covers the risk."
  - id: o2
    text: "Explain why self-critique skews positive, and why it can be a first pass but never the only gate."
  - id: o3
    text: "Feed a failing check back into the loop so that success is silent and failure is verbose, with a cap and a no-progress exit on the retries."
  - id: o4
    text: "Price an unverified run against a gate on every step, and decide where a gate belongs, including before an action that cannot be undone."
