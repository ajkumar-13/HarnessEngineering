<text x="40" y="592" class="t-note" data-w="352">In this post's run the evaluator called write_file once:</text>
<text x="40" y="616" class="t-note" data-w="313">refused. Files written: generator 4, evaluator 0.</text>
<text x="40" y="684" class="t-note" data-w="677">The contract is fixed before the work, and the work crosses into a registry that can read but not write.</text>
</svg>
