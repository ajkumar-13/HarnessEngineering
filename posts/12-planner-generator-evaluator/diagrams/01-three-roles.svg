<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-three-roles-title" aria-describedby="hrn-01-three-roles-desc">
<title id="hrn-01-three-roles-title">The grader is a separate agent that never sees the reasoning</title>
<desc id="hrn-01-three-roles-desc">Three role cards. Top left, the planner, in blue: it reads the task and the repository, writes the plan and numbered criteria, and never sees the work, which does not exist yet. Its criteria go into a green contract card at top right: six numbered criteria agreed with the evaluator before attempt 1 and frozen, each routed to its cheapest verifier, only criterion 6 judged. Bottom left, the generator, in orange: it reads the plan, the contract and the last report, writes the artefact and nothing else, and never sees the evaluator's reasoning. Bottom right, the evaluator, in purple, inside a purple frame labelled registry: read_file only: it reads the contract and the finished work, writes PASS or NEEDS_WORK and a report, and never sees the generator's reasoning. The work crosses the frame to the evaluator; a red arrow carries NEEDS_WORK and the named failures back to the generator; PASS leads down to done. A note: in this post's run the evaluator called write_file once and was refused; files written, generator 4, evaluator 0.</desc>
