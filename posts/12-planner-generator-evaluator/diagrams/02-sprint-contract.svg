<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-02-sprint-contract-title" aria-describedby="hrn-02-sprint-contract-desc">
<title id="hrn-02-sprint-contract-title">The bar is fixed before the work and never moves</title>
<desc id="hrn-02-sprint-contract-desc">Above, the negotiation: the planner drafts seven criteria, the evaluator refuses criterion 7, the code is clean, because it names nothing observable, and the contract is frozen with six criteria as digest 07c1ff17 before attempt 1. Below, a table of the six criteria, each with its verifier (unit test, unit test, schema check, annotation check, script, and the evaluator for the judged sixth), against three attempts. Attempt 1 leaves criteria 2, 3 and 6 unmet: NEEDS_WORK. Attempt 2 leaves only criterion 6 unmet: NEEDS_WORK, and the evaluator's write_file call is refused. Attempt 3 meets all six: PASS. The digest is 07c1ff17 on every attempt.</desc>
