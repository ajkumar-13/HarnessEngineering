<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-the-unchecked-edge-title" aria-describedby="hrn-03-the-unchecked-edge-desc">
<title id="hrn-03-the-unchecked-edge-title">The evaluator checks the work; nothing checks the contract</title>
<desc id="hrn-03-the-unchecked-edge-desc">Five cards in a row: the task, the planner, the contract, the generator and the evaluator. A purple bracket below, from the contract to the evaluator, is labelled checked: the evaluator grades the work against the contract. A red bracket above, from the task to the contract, is labelled not checked: nothing grades the contract against the task. Below the contract, a human card with a purple approval arrow up to the contract: a person reads the criteria, the one point where a missing requirement is still cheap to add. A note gives the example from this post's run: no criterion says what parse() does with a negative amount.</desc>
<style>
  :root {
    --hrn-bg: #FAFAF7;
    --hrn-surface: #FFFFFF;
    --hrn-ink: #1A1A1A;
    --hrn-ink-muted: #5C5C5C;
    --hrn-ink-subtle: #9A9A9A;
    --hrn-border: #D9D9D4;
    --hrn-primary: #5B7FBF;
    --hrn-accent: #D98E5F;
    --hrn-success: #5C9E78;
    --hrn-warn: #B8895A;
    --hrn-alert: #C66B5E;
    --hrn-neutral-1: #EAEAE4;
    --hrn-neutral-2: #CFCFC8;
    --hrn-neutral-3: #8E8E88;
    --hrn-on-fill: #FFFDF9;
    --hrn-on-accent: #1A1A1A;
    --hrn-grid: rgba(26, 26, 26, 0.06);
    --hrn-rule: #8E8E88;
    --hrn-arrow: #6E6E68;
    --hrn-neutral-soft: #F2F2EE;
    --hrn-blue: #0072B2;
    --hrn-blue-ink: #005A8C;
    --hrn-blue-soft: #E3F0F8;
    --hrn-blue-line: #9CC6E0;
    --hrn-orange: #C98500;
    --hrn-orange-ink: #8A5B00;
    --hrn-orange-soft: #FBF0D9;
    --hrn-orange-line: #E5C27A;
    --hrn-green: #008F68;
    --hrn-green-ink: #006B4E;
    --hrn-green-soft: #DFF3EC;
    --hrn-green-line: #8FCDB8;
    --hrn-red: #A8322A;
    --hrn-red-ink: #8F2A23;
    --hrn-red-soft: #F8E3E1;
    --hrn-red-line: #DDA49F;
    --hrn-purple: #A14D8C;
    --hrn-purple-ink: #833E72;
    --hrn-purple-soft: #F4E4EF;
    --hrn-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --hrn-bg: #0E0F12;
      --hrn-surface: #16181C;
      --hrn-ink: #F2F2EE;
      --hrn-ink-muted: #B4B4AE;
      --hrn-ink-subtle: #6E6E68;
      --hrn-border: #2A2D33;
      --hrn-primary: #8BA8E0;
      --hrn-accent: #E8B088;
      --hrn-success: #7FBF9B;
      --hrn-warn: #D4B58A;
      --hrn-alert: #D88880;
      --hrn-neutral-1: #1F2229;
      --hrn-neutral-2: #2C3038;
      --hrn-neutral-3: #6E6E68;
      --hrn-on-fill: #14161A;
      --hrn-on-accent: #1A1A1A;
      --hrn-grid: rgba(241, 238, 232, 0.08);
      --hrn-rule: #6A6D74;
      --hrn-arrow: #9A9A94;
      --hrn-neutral-soft: #1C1E23;
      --hrn-blue: #5AA8E0;
      --hrn-blue-ink: #7DBBE8;
      --hrn-blue-soft: #14283A;
      --hrn-blue-line: #2E5878;
      --hrn-orange: #E8B040;
      --hrn-orange-ink: #F0C060;
      --hrn-orange-soft: #33260F;
      --hrn-orange-line: #6E5222;
      --hrn-green: #3CC497;
      --hrn-green-ink: #62D1AC;
      --hrn-green-soft: #10302A;
      --hrn-green-line: #2A6A55;
      --hrn-red: #E8796E;
      --hrn-red-ink: #F09A90;
      --hrn-red-soft: #3A1A18;
      --hrn-red-line: #7A3A34;
      --hrn-purple: #D58CC4;
      --hrn-purple-ink: #E2A6D3;
      --hrn-purple-soft: #331F2E;
      --hrn-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--hrn-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--hrn-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--hrn-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--hrn-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--hrn-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--hrn-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--hrn-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--hrn-surface); stroke: var(--hrn-rule); stroke-width: 1; }
  .card { fill: var(--hrn-neutral-soft); stroke: var(--hrn-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--hrn-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--hrn-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--hrn-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--hrn-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--hrn-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--hrn-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-ink { fill: var(--hrn-blue-ink); }
  .f-blue-soft { fill: var(--hrn-blue-soft); }
  .f-green-ink { fill: var(--hrn-green-ink); }
  .f-green-soft { fill: var(--hrn-green-soft); }
  .f-orange-ink { fill: var(--hrn-orange-ink); }
  .f-orange-soft { fill: var(--hrn-orange-soft); }
  .f-purple { fill: var(--hrn-purple); }
  .f-purple-ink { fill: var(--hrn-purple-ink); }
  .f-purple-soft { fill: var(--hrn-purple-soft); }
  .f-red-ink { fill: var(--hrn-red-ink); }
  .s-blue-line { stroke: var(--hrn-blue-line); }
  .s-green-line { stroke: var(--hrn-green-line); }
  .s-orange-line { stroke: var(--hrn-orange-line); }
  .s-purple { stroke: var(--hrn-purple); }
  .s-purple-line { stroke: var(--hrn-purple-line); }
  .s-red { stroke: var(--hrn-red); }
</style>
<defs>
<marker id="hrn-03-the-unchecked-edge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
<marker id="hrn-03-the-unchecked-edge-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-purple"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="729">The evaluator checks the work; nothing checks the contract</text>
<text x="40" y="76" class="t-subtitle" data-w="496">A planner's missing requirement passes every gate downstream of it.</text>
<rect x="40" y="168" width="144" height="64" rx="8" class="card"/>
<text x="112" y="208" text-anchor="middle" class="t-head" data-w="35">task</text>
<rect x="224" y="168" width="144" height="64" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="296" y="208" text-anchor="middle" class="t-head f-blue-ink" data-w="62">planner</text>
<rect x="408" y="168" width="144" height="64" rx="8" class="f-green-soft s-green-line w1"/>
<text x="480" y="208" text-anchor="middle" class="t-head f-green-ink" data-w="69">contract</text>
<rect x="592" y="168" width="144" height="64" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="664" y="208" text-anchor="middle" class="t-head f-orange-ink" data-w="79">generator</text>
<rect x="776" y="168" width="144" height="64" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="848" y="208" text-anchor="middle" class="t-head f-purple-ink" data-w="76">evaluator</text>
<path d="M184,200 L221,200" class="flow" marker-end="url(#hrn-03-the-unchecked-edge-arrow)"/>
<path d="M368,200 L405,200" class="flow" marker-end="url(#hrn-03-the-unchecked-edge-arrow)"/>
<path d="M552,200 L589,200" class="flow" marker-end="url(#hrn-03-the-unchecked-edge-arrow)"/>
<path d="M736,200 L773,200" class="flow" marker-end="url(#hrn-03-the-unchecked-edge-arrow)"/>
<path d="M112,152 V144 H480 V152" class="s-red w1 nofill"/>
<g data-grid="skip">
<text x="296" y="136" text-anchor="middle" class="t-note f-red-ink" data-w="281">not checked: the contract against the task</text>
</g>
<path d="M480,248 V256 H848 V248" class="s-purple w1 nofill"/>
<g data-grid="skip">
<text x="664" y="276" text-anchor="middle" class="t-note f-purple-ink" data-w="259">checked: the work against the contract</text>
</g>
<rect x="304" y="320" width="288" height="72" rx="8" class="card"/>
<text x="320" y="352" class="t-head" data-w="56">human</text>
<text x="320" y="376" class="t-label" data-w="205">reads the criteria, not the work</text>
<path d="M432,320 L432,235" class="s-purple w15 nofill" marker-end="url(#hrn-03-the-unchecked-edge-arrow-purple)"/>
<text x="444" y="280" class="t-note f-purple-ink" data-w="59">approval</text>
<text x="40" y="432" class="t-note" data-w="600">Example from this post's run: no criterion says what parse() does with a negative amount,</text>
<text x="40" y="456" class="t-note" data-w="553">so no attempt is checked for it, and PASS would still be honest about the contract.</text>
<text x="40" y="504" class="t-note" data-w="481">Every check pushes trust somewhere else; here it lands on the contract.</text>
</svg>
