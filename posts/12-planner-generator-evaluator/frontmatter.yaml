slug: 12-planner-generator-evaluator
title: "12 · Planner / generator / evaluator — separating the roles"

description: >
  Post 11 showed that a model grading its own work skews positive. The structural fix is
  to make the grader a different agent from the maker: a planner decomposes the task and
  sets a contract, a generator builds to it, and an independent evaluator grades the
  result against that contract.

