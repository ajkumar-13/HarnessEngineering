outcomes:
  - id: o1
    text: "Separate the author of a piece of work from its grader, and say what each of the three roles reads, writes and never sees."
  - id: o2
    text: "Write a sprint contract that fixes done before generation starts, and route each criterion to the cheapest verifier that can settle it."
  - id: o3
    text: "Design against the evaluator's own biases, give it tools to gather its own evidence, and enforce its read-only boundary in its tool registry."
  - id: o4
    text: "Explain why nothing in the pattern checks the planner, and put the missing check on the contract."
  - id: o5
    text: "Price three roles against one agent, and decide when a single agent with a test suite is enough."
