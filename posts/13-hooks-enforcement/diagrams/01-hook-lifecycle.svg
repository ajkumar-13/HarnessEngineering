<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-hook-lifecycle-title" aria-describedby="hrn-01-hook-lifecycle-desc">
<title id="hrn-01-hook-lifecycle-title">Only the two points in front of an action can block</title>
<desc id="hrn-01-hook-lifecycle-desc">The agent loop as three cards: reason, the model call, in blue; act, a tool runs, in orange; observe, results return, in green; arrows run reason to act, act to observe, and observe back to reason for the next turn, inside a frame labelled the loop. A green memory file card outside the frame feeds reason through a grey square marked session start, supplies. On the arrow from reason to act a purple diamond marks pre-tool, blocks the call. On the arrow from act to observe a grey square marks post-edit, reports only. An arrow from act leaves the frame to a green git commit card through a purple diamond marked pre-commit, blocks the commit, with a note that it is git's own hook, one layer below the agent. A legend says a diamond can block and a square cannot.</desc>
<style>
