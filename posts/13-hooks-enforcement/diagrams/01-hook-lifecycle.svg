</style>
<defs>
<marker id="hrn-01-hook-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="611">Only the two points in front of an action can block</text>
<text x="40" y="76" class="t-subtitle" data-w="620">The four points of Osmani's list on the loop; purple can block, grey supplies or reports.</text>
<rect x="304" y="128" width="560" height="400" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="320" y="156" class="t-note" data-w="55">the loop</text>
