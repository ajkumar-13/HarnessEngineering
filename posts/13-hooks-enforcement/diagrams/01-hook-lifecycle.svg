<path d="M416,400 L416,263" class="flow" marker-end="url(#hrn-01-hook-lifecycle-arrow)"/>
<text x="428" y="336" class="t-note" data-w="60">next turn</text>
<path d="M776,260 L776,597" class="flow" marker-end="url(#hrn-01-hook-lifecycle-arrow)"/>
<path d="M776,545.6 L790.4,560 L776,574.4 L761.6,560 Z" class="f-purple s-surface w1"/>
<text x="800" y="556" class="t-label f-purple-ink b" data-w="84">pre-commit</text>
<text x="800" y="576" class="t-note f-purple-ink" data-w="123">blocks the commit</text>
<text x="624" y="632" text-anchor="end" class="t-note" data-w="278">git's own hook, one layer below the agent</text>
<path d="M48,430 L54,436 L48,442 L42,436 Z" class="f-purple s-surface w1"/>
<text x="72" y="440" class="t-label" data-w="64">can block</text>
<path d="M43.5,455.5 H52.5 V464.5 H43.5 Z" class="f-rule s-surface w1"/>
<text x="72" y="464" class="t-label" data-w="86">cannot block</text>
<text x="40" y="684" class="t-note" data-w="635">Session start and post-edit never stop anything: one brings a rule in, the other reports a break.</text>
</svg>
