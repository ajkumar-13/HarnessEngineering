<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-block-vs-report-title" aria-describedby="hrn-02-block-vs-report-desc">
<title id="hrn-02-block-vs-report-title">A block lands before the act; a report lands after it</title>
<desc id="hrn-02-block-vs-report-desc">Two runs from snippets/block_vs_report.py, turns left to right, with a dashed line marking the act. Top, pre-tool: the model proposes rm -rf workspace; the purple pre-tool hook blocks it, recursive delete of the workspace; the executor, drawn dashed, is never called, 0 calls; marker.txt still exists. Bottom, post-edit: the model proposes an edit to calc.py; nothing stands in front of it; act writes calc.py and it stays; the post-edit hook runs the tests and reports AssertionError: add(2, 2) != 4.</desc>
