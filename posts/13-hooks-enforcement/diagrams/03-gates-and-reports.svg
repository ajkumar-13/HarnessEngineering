<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">The pre-tool gate and the post-edit report, compared by signature and composition</title>
  <desc id="d">A hand-drawn comparison of the two kinds of hook. On the left, a pre-tool hook, which prevents: its signature takes a tool and its arguments and returns a Decision; it returns a verdict, either allow or block with a reason; the hooks compose in order and the first block wins, because there is no point asking the rest whether a command already ruled out is also acceptable, and stopping early keeps the hot path cheap; and the model sees the reason string in the same channel a successful call would have used, never an exception. On the right, a post-edit hook, which corrects: its signature takes a path and the content and returns either a string or nothing; it returns a finding, a problem or nothing at all; all such hooks run and every problem is collected, because the model is about to spend a turn responding and should see all of what broke rather than only the first thing; and the model sees every finding at once, appended as one observation, while the edit itself still stands. Captions record that collapsing the two into one type invites code that treats a post-edit failure as a block, which the runtime cannot honour, and that the reason string is part of the design, since a model that cannot tell a policy block from a broken tool will retry the blocked call, which is a doom loop manufactured by your own guardrail.</desc>

