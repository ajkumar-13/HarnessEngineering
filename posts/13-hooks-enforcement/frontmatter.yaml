code: included
outcomes:
  - id: o1
    text: "Name the four hook lifecycle points, session start, pre-tool, post-edit and pre-commit, say which two can block, and place the stop gate beside them."
  - id: o2
    text: "Write a pre-tool gate and a post-edit report hook with their signatures and the exit-code contract, so that a block reaches the model with its reason."
  - id: o3
    text: "Decide which rules to enforce with a hook and which to leave to verification, and explain why the hook is the enforcement tooth of the ratchet."
  - id: o4
    text: "Keep a hook fast and quiet: scope it with a matcher, keep a deny-list in-process, and fail closed on safety."
  - id: o5
    text: "Give a hook a named, single-use, logged escape hatch, and test it with near misses in both directions."
