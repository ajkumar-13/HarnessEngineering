slug: 13-hooks-enforcement
title: "13 - Hooks and deterministic enforcement: guardrails as code"
summary: "A hook is deterministic code at a fixed lifecycle point that enforces a rule whatever the model decides. Only the two points in front of an action can block it; the other two supply or report."
