<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-sandbox-boundary-title" aria-describedby="hrn-01-sandbox-boundary-desc">
<title id="hrn-01-sandbox-boundary-title">A sandbox bounds what a run can reach</title>
<desc id="hrn-01-sandbox-boundary-desc">A purple frame labelled sandbox holds an orange bash tool card (named programs, inside /work, no network, time-limited, fresh each run) and a green workspace card, mounted and kept. Five red arrows leave the bash tool and each ends at a purple gate bar on the frame's right edge, named allow-list, path jail, network, resource limit and ephemeral runtime, with the word blocked beside each. Outside the frame, in neutral cards, what each keeps out of reach: every program not named; the home directory and other projects; the internet beyond the listed domains; the host's processor, memory and disk; and the next run.</desc>
<style>
  :root {
    --hrn-bg: #FAFAF7;
    --hrn-surface: #FFFFFF;
    --hrn-ink: #1A1A1A;
    --hrn-ink-muted: #5C5C5C;
    --hrn-ink-subtle: #9A9A9A;
    --hrn-border: #D9D9D4;
    --hrn-primary: #5B7FBF;
    --hrn-accent: #D98E5F;
    --hrn-success: #5C9E78;
    --hrn-warn: #B8895A;
    --hrn-alert: #C66B5E;
    --hrn-neutral-1: #EAEAE4;
    --hrn-neutral-2: #CFCFC8;
    --hrn-neutral-3: #8E8E88;
    --hrn-on-fill: #FFFDF9;
    --hrn-on-accent: #1A1A1A;
    --hrn-grid: rgba(26, 26, 26, 0.06);
    --hrn-rule: #8E8E88;
    --hrn-arrow: #6E6E68;
    --hrn-neutral-soft: #F2F2EE;
    --hrn-blue: #0072B2;
    --hrn-blue-ink: #005A8C;
    --hrn-blue-soft: #E3F0F8;
    --hrn-blue-line: #9CC6E0;
    --hrn-orange: #C98500;
    --hrn-orange-ink: #8A5B00;
    --hrn-orange-soft: #FBF0D9;
    --hrn-orange-line: #E5C27A;
    --hrn-green: #008F68;
    --hrn-green-ink: #006B4E;
    --hrn-green-soft: #DFF3EC;
    --hrn-green-line: #8FCDB8;
    --hrn-red: #A8322A;
    --hrn-red-ink: #8F2A23;
    --hrn-red-soft: #F8E3E1;
    --hrn-red-line: #DDA49F;
    --hrn-purple: #A14D8C;
    --hrn-purple-ink: #833E72;
    --hrn-purple-soft: #F4E4EF;
    --hrn-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --hrn-bg: #0E0F12;
      --hrn-surface: #16181C;
      --hrn-ink: #F2F2EE;
      --hrn-ink-muted: #B4B4AE;
      --hrn-ink-subtle: #6E6E68;
      --hrn-border: #2A2D33;
      --hrn-primary: #8BA8E0;
      --hrn-accent: #E8B088;
      --hrn-success: #7FBF9B;
      --hrn-warn: #D4B58A;
      --hrn-alert: #D88880;
      --hrn-neutral-1: #1F2229;
      --hrn-neutral-2: #2C3038;
      --hrn-neutral-3: #6E6E68;
      --hrn-on-fill: #14161A;
      --hrn-on-accent: #1A1A1A;
      --hrn-grid: rgba(241, 238, 232, 0.08);
      --hrn-rule: #6A6D74;
      --hrn-arrow: #9A9A94;
      --hrn-neutral-soft: #1C1E23;
      --hrn-blue: #5AA8E0;
      --hrn-blue-ink: #7DBBE8;
      --hrn-blue-soft: #14283A;
      --hrn-blue-line: #2E5878;
      --hrn-orange: #E8B040;
      --hrn-orange-ink: #F0C060;
      --hrn-orange-soft: #33260F;
      --hrn-orange-line: #6E5222;
      --hrn-green: #3CC497;
      --hrn-green-ink: #62D1AC;
      --hrn-green-soft: #10302A;
      --hrn-green-line: #2A6A55;
      --hrn-red: #E8796E;
      --hrn-red-ink: #F09A90;
      --hrn-red-soft: #3A1A18;
      --hrn-red-line: #7A3A34;
      --hrn-purple: #D58CC4;
      --hrn-purple-ink: #E2A6D3;
      --hrn-purple-soft: #331F2E;
      --hrn-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--hrn-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--hrn-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--hrn-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--hrn-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--hrn-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--hrn-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--hrn-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--hrn-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--hrn-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--hrn-surface); stroke: var(--hrn-rule); stroke-width: 1; }
  .card { fill: var(--hrn-neutral-soft); stroke: var(--hrn-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--hrn-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--hrn-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--hrn-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--hrn-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--hrn-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--hrn-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--hrn-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-green-soft { fill: var(--hrn-green-soft); }
  .f-orange-soft { fill: var(--hrn-orange-soft); }
  .f-purple { fill: var(--hrn-purple); }
  .f-purple-ink { fill: var(--hrn-purple-ink); }
  .f-red { fill: var(--hrn-red); }
  .f-red-ink { fill: var(--hrn-red-ink); }
  .s-green-line { stroke: var(--hrn-green-line); }
  .s-orange-line { stroke: var(--hrn-orange-line); }
  .s-purple { stroke: var(--hrn-purple); }
  .s-red { stroke: var(--hrn-red); }
</style>
<defs>
<marker id="hrn-01-sandbox-boundary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
<marker id="hrn-01-sandbox-boundary-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-red"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="488">A sandbox bounds what a run can reach</text>
<text x="40" y="76" class="t-subtitle" data-w="488">Five constraints sit on one frame; every reach past it ends at a gate.</text>
<rect x="40" y="128" width="424" height="328" rx="8" class="w15 nofill s-purple" data-fit="skip"/>
<text x="40" y="120" class="t-head f-purple-ink" data-w="70">sandbox</text>
<rect x="72" y="152" width="176" height="224" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="88" y="184" class="t-head" data-w="76">bash tool</text>
<text x="88" y="216" class="t-label" data-w="115">named programs</text>
<text x="88" y="240" class="t-label" data-w="82">inside /work</text>
<text x="88" y="264" class="t-label" data-w="75">no network</text>
<text x="88" y="288" class="t-label" data-w="81">time-limited</text>
<text x="88" y="312" class="t-label" data-w="96">fresh each run</text>
<rect x="72" y="392" width="352" height="48" rx="8" class="f-green-soft s-green-line w1"/>
<text x="88" y="424" class="t-head" data-w="246">workspace: mounted and kept</text>
<text x="568" y="120" class="t-head" data-w="99">out of reach</text>
<path d="M248,176 L457,176" class="s-red w15 nofill" marker-end="url(#hrn-01-sandbox-boundary-arrow-red)"/>
<text x="452" y="168" text-anchor="end" class="t-label f-purple-ink" data-w="60">allow-list</text>
<rect x="460" y="160" width="8" height="32" class="f-purple"/>
<text x="484" y="180" class="t-label f-red-ink" data-w="53">blocked</text>
<g data-grid="skip">
<rect x="568" y="158" width="352" height="36" rx="8" class="card"/>
</g>
<text x="584" y="180" class="t-label" data-w="174">every program not named</text>
<path d="M248,220 L457,220" class="s-red w15 nofill" marker-end="url(#hrn-01-sandbox-boundary-arrow-red)"/>
<text x="452" y="212" text-anchor="end" class="t-label f-purple-ink" data-w="54">path jail</text>
<rect x="460" y="204" width="8" height="32" class="f-purple"/>
<text x="484" y="224" class="t-label f-red-ink" data-w="53">blocked</text>
<g data-grid="skip">
<rect x="568" y="202" width="352" height="36" rx="8" class="card"/>
</g>
<text x="584" y="224" class="t-label" data-w="228">the home directory, other projects</text>
<path d="M248,264 L457,264" class="s-red w15 nofill" marker-end="url(#hrn-01-sandbox-boundary-arrow-red)"/>
<text x="452" y="256" text-anchor="end" class="t-label f-purple-ink" data-w="54">network</text>
<rect x="460" y="248" width="8" height="32" class="f-purple"/>
<text x="484" y="268" class="t-label f-red-ink" data-w="53">blocked</text>
<g data-grid="skip">
<rect x="568" y="246" width="352" height="36" rx="8" class="card"/>
</g>
<text x="584" y="268" class="t-label" data-w="233">the internet beyond listed domains</text>
<path d="M248,308 L457,308" class="s-red w15 nofill" marker-end="url(#hrn-01-sandbox-boundary-arrow-red)"/>
<text x="452" y="300" text-anchor="end" class="t-label f-purple-ink" data-w="91">resource limit</text>
<rect x="460" y="292" width="8" height="32" class="f-purple"/>
<text x="484" y="312" class="t-label f-red-ink" data-w="53">blocked</text>
<g data-grid="skip">
<rect x="568" y="290" width="352" height="36" rx="8" class="card"/>
</g>
<text x="584" y="312" class="t-label" data-w="234">the host's processor, memory, disk</text>
<path d="M248,352 L457,352" class="s-red w15 nofill" marker-end="url(#hrn-01-sandbox-boundary-arrow-red)"/>
<text x="452" y="344" text-anchor="end" class="t-label f-purple-ink" data-w="127">ephemeral runtime</text>
<rect x="460" y="336" width="8" height="32" class="f-purple"/>
<text x="484" y="356" class="t-label f-red-ink" data-w="53">blocked</text>
<g data-grid="skip">
<rect x="568" y="334" width="352" height="36" rx="8" class="card"/>
</g>
<text x="584" y="356" class="t-label" data-w="81">the next run</text>
<text x="40" y="504" class="t-note" data-w="668">The workspace outlives the run, so a poisoned file written there is a channel the box does not close.</text>
</svg>
