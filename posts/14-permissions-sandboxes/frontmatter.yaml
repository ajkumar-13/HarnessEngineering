outcomes:
  - id: o1
    text: "Wrap the bash tool in an allow-list sandbox with no shell, a timeout and a jail checked on resolved paths, and say which isolation tier really enforces it."
  - id: o2
    text: "Declare permissions as a role table with argv-pattern rules and a default deny, and scope credentials by scope, lifetime and attribution."
  - id: o3
    text: "Reason about blast radius: for each tool, name its worst case, the grant that shrinks it and what the run gives up, and gate by reversibility."
  - id: o4
    text: "Defend a tool-using agent against indirect prompt injection in layers, counting every tool that can publish as egress."
  - id: o5
    text: "Make every gate emit a distinguishable outcome in the trace, and fill in the six-question threat model for a harness."
