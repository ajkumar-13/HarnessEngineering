title: "14 - Permissions, sandboxes, and security: the AI control plane"
summary: "An agent with real tools is an attack surface and a blast radius: a deny-list hook stops the known-bad command, a sandbox bounds the rest, and declared permissions and gates that record which one fired make the bound checkable."
