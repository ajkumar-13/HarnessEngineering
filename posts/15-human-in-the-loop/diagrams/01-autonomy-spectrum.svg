<text x="280" y="204" class="t-label" data-w="99">on each action</text>
<text x="280" y="236" class="t-note" data-w="50">human:</text>
<text x="336" y="236" class="t-label b" data-w="91">the approver</text>
<rect x="488" y="128" width="208" height="128" rx="8" class="card"/>
<text x="504" y="156" class="t-head" data-w="115">Act and notify</text>
<text x="504" y="184" class="t-label" data-w="90">acts; only the</text>
<text x="504" y="204" class="t-label" data-w="132">irreversible is gated</text>
<text x="504" y="236" class="t-note" data-w="50">human:</text>
<text x="560" y="236" class="t-label b" data-w="103">the supervisor</text>
<rect x="712" y="128" width="208" height="128" rx="8" class="card"/>
<text x="728" y="156" class="t-head" data-w="105">Autonomous</text>
<text x="728" y="184" class="t-label" data-w="109">acts; the work is</text>
<text x="728" y="204" class="t-label" data-w="135">reviewed afterwards</text>
<text x="728" y="236" class="t-note" data-w="50">human:</text>
<text x="784" y="236" class="t-label b" data-w="90">the observer</text>
<text x="40" y="288" class="t-head" data-w="430">One coding agent: the stop is chosen for each action</text>
