<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="508">Choose the stop per action, not per agent</text>
<text x="40" y="76" class="t-subtitle" data-w="602">What the human becomes at each stop, and where one coding agent's actions land.</text>
<path d="M40,112 L917,112" class="flow" marker-end="url(#hrn-01-autonomy-spectrum-arrow)"/>
<text x="40" y="104" class="t-note" data-w="98">less autonomy</text>
<text x="920" y="104" text-anchor="end" class="t-note" data-w="106">more autonomy</text>
