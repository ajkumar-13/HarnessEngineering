<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-autonomy-spectrum-title" aria-describedby="hrn-01-autonomy-spectrum-desc">
<title id="hrn-01-autonomy-spectrum-title">Choose the stop per action, not per agent</title>
<desc id="hrn-01-autonomy-spectrum-desc">Four cards on an axis from less autonomy to more. Suggest: the agent proposes and does not act; the human is the operator. Approve, drawn as a gate: the agent acts after a decision on each action; the human is the approver. Act and notify: the agent acts and only the irreversible is gated; the human is the supervisor. Autonomous: the agent acts and the work is reviewed afterwards; the human is the observer. Below, a table of one coding agent's five actions: read the logs, run the tests and edit the working tree are autonomous because a checkpoint undoes them; open a pull request needs approval because others see it first; deploy to production needs approval because it cannot be undone.</desc>
