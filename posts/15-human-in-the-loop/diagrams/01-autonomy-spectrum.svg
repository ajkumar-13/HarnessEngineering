<rect x="488" y="388" width="432" height="28" class="nofill"/>
<rect x="40" y="416" width="272" height="28" class="nofill"/>
<rect x="312" y="416" width="176" height="28" class="nofill"/>
<rect x="488" y="416" width="432" height="28" class="nofill"/>
<rect x="40" y="444" width="272" height="28" class="nofill"/>
<rect x="312" y="444" width="176" height="28" class="nofill"/>
<rect x="488" y="444" width="432" height="28" class="nofill"/>
<path d="M40,304H920M40,472H920" class="axis"/>
<path d="M40,332H920" class="rule1"/>
<text x="48" y="324" class="t-head" data-w="51">action</text>
<text x="320" y="324" class="t-head" data-w="62">its stop</text>
<text x="496" y="324" class="t-head" data-w="33">why</text>
<text x="48" y="352" class="t-label" data-w="88">read the logs</text>
<text x="320" y="352" class="t-label" data-w="84">autonomous</text>
<text x="496" y="352" class="t-label" data-w="66">reversible</text>
<text x="48" y="380" class="t-label" data-w="85">run the tests</text>
<text x="320" y="380" class="t-label" data-w="84">autonomous</text>
<text x="496" y="380" class="t-label" data-w="66">reversible</text>
<text x="48" y="408" class="t-label" data-w="138">edit the working tree</text>
<text x="320" y="408" class="t-label" data-w="84">autonomous</text>
<text x="496" y="408" class="t-label" data-w="225">reversible: a checkpoint undoes it</text>
<text x="48" y="436" class="t-label" data-w="130">open a pull request</text>
<text x="320" y="436" class="t-label" data-w="55">approve</text>
<text x="496" y="436" class="t-label" data-w="297">visible: others see it before it can be undone</text>
<text x="48" y="464" class="t-label" data-w="139">deploy to production</text>
<text x="320" y="464" class="t-label" data-w="55">approve</text>
<text x="496" y="464" class="t-label" data-w="222">irreversible: no rollback undoes it</text>
<text x="40" y="504" class="t-note" data-w="687">Pinning a whole agent to one stop wastes attention on safe actions or gives away the dangerous ones.</text>
</svg>
