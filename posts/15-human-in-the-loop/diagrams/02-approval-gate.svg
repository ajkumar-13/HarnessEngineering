<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-approval-gate-title" aria-describedby="hrn-02-approval-gate-desc">
<title id="hrn-02-approval-gate-title">Only the flagged calls wait, never past the timeout</title>
<desc id="hrn-02-approval-gate-desc">Five calls of the snippet's run on an axis of seconds spent at the gate, from 0 to 0.5. Reading build.log is not gated and runs without waiting. Writing notes.md waits 0.1 seconds for the reviewer, who approves it, and it runs. Deploying to production waits 0.1 seconds and the reviewer denies it. Writing draft.md waits the full 0.5 seconds with no answer; it is reversible, so it runs with a note. Deploying to staging waits 0.5 seconds with no answer; it is irreversible, so it is denied.</desc>
