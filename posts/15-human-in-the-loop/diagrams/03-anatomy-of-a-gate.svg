<text x="544" y="144" class="t-head f-orange-ink" data-w="78">not gated</text>
<text x="648" y="144" class="t-label" data-w="82">the call runs</text>
<rect x="528" y="176" width="392" height="48" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="544" y="208" class="t-head f-orange-ink" data-w="77">approved</text>
<text x="648" y="208" class="t-label" data-w="82">the call runs</text>
