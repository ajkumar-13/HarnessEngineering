<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-anatomy-of-a-gate-title" aria-describedby="hrn-03-anatomy-of-a-gate-desc">
<title id="hrn-03-anatomy-of-a-gate-title">Two halves, four outcomes, one record</title>
<desc id="hrn-03-anatomy-of-a-gate-desc">A tool call goes to the policy, needs_approval, ordinary code that decides which calls are gated. A call it does not gate runs. A gated call goes to the decider: a human, a classifier, or a stub in a test. Three outcomes leave the decider: approved, the call runs; denied, the reason returns to the agent as an observation; no answer, the call is denied if it is irreversible and runs with a note if it is reversible. Under all of it, the record each decision leaves: the call and its arguments, why it was gated, who decided, the verdict, and how long it waited.</desc>
