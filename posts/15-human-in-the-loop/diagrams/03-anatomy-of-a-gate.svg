<path d="M440,312 L525.05,327.46" class="flow" marker-end="url(#hrn-03-anatomy-of-a-gate-arrow)"/>
<rect x="40" y="400" width="880" height="72" rx="8" class="f-green-soft s-green-line w1"/>
<text x="56" y="428" class="t-head f-green-ink" data-w="227">the record of every decision</text>
<text x="56" y="452" class="t-label" data-w="596">the call and its arguments, why it was gated, who decided, the verdict, how long it waited</text>
<text x="40" y="504" class="t-note" data-w="568">The companion's Result keeps only a (tool, message) pair, and only for refused calls.</text>
</svg>
