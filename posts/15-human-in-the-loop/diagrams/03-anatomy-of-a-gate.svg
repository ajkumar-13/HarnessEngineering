<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="474">Two halves, four outcomes, one record</text>
<text x="40" y="76" class="t-subtitle" data-w="587">The policy is code a test can assert against; the decider is a seam a test can stub.</text>
<rect x="40" y="128" width="160" height="64" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="56" y="156" class="t-head f-orange-ink" data-w="79">a tool call</text>
