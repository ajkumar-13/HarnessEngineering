title: "15 · Human-in-the-loop — approvals, interventions, async feedback"

description: >
  Full autonomy is rarely the goal; the useful question is where on the autonomy spectrum
  each action belongs. The harness decides which actions a human must approve (the
  irreversible and the publicly visible ones), how a human can interrupt a run in flight,
  and how feedback re-enters the loop without making the human a bottleneck.

