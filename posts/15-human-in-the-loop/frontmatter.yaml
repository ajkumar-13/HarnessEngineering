title: "15 - Human-in-the-loop: approvals, interventions, async feedback"
summary: "A harness gates what a checkpoint cannot undo or others will see first, separates the policy from the decider, lets a human steer a run in flight, and makes approval asynchronous, bounded and rare."
date: 2026-08-13
updated: 2026-10-15
status: complete
part: "Part III - Control and reliability"
level: intermediate
reading_time: 27
tags: [harness-engineering, control, human-in-the-loop, approvals, oversight, reviewer-fatigue]
hero: diagrams/01-autonomy-spectrum.svg
prerequisites: [hrn-013]
code: included
outcomes:
  - id: o1
    text: "Place each action on the autonomy spectrum by reversibility and visibility, and gate only what a checkpoint cannot undo or others see first."
  - id: o2
    text: "Build an approval gate whose policy and decider are separate, test it with a stubbed decider, and return a denial as an observation."
  - id: o3
    text: "Choose among the answers between yes and no, and decide what a gate does when nobody answers: wait, deny, proceed with a note, or defer."
  - id: o4
    text: "Write escalation triggers from run signals, and keep a run open to interruption and steering while it is in flight."
  - id: o5
    text: "Size an approval budget against measured reviewer fatigue, and keep the record that makes a rubber-stamp rate measurable."
