<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-topologies-gallery-title" aria-describedby="hrn-01-topologies-gallery-desc">
<title id="hrn-01-topologies-gallery-title">Four shapes, and who writes the control flow</title>
<desc id="hrn-01-topologies-gallery-desc">Four panels. Single agent: one agent card, its own loop, sends three sub-tasks out and runs them itself; control flow: the model, in one loop. Orchestrator-worker: a lead dispatches four workers, whose results return to the lead to merge; control flow: the engineer's dispatch and merge, the lead's split. Pipeline: one draft passes through draft, edit and fact-check stages in order; control flow: the engineer, at design time. Swarm: four peer agents claim work from a shared repository of task files, with no lead; control flow: nobody centrally, the repository.</desc>
