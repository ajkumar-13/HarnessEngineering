<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-the-coordination-tax-title" aria-describedby="hrn-03-the-coordination-tax-desc">
<title id="hrn-03-the-coordination-tax-title">The prefix is paid per call; the clock waits for the slowest</title>
<desc id="hrn-03-the-coordination-tax-desc">Two panels for the read fan-out, computed by the post's fan_out.py and illustrative. Left, input in input-rate tokens. One agent: 11,659, of which 1,198 is the shared prefix. Lead and four workers, uncached: 18,065, of which 7,188 is the prefix paid six times. The same, cached: 12,974, the prefix written once and read five times. Right, simulated seconds on one axis. One agent does pieces of 10, 10, 10 and 90 seconds in turn, 120 seconds. The lead plans for 5 seconds, four workers run in parallel for 10, 10, 10 and 90, and the lead merges for 5: 100 seconds.</desc>
