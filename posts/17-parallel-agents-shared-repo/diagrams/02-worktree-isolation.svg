</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="620">One working copy per agent, one way back to main</text>
<text x="40" y="76" class="t-subtitle" data-w="640">Worktrees share the repository's history; each branch lands only through the merge gate.</text>
