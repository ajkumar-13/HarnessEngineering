<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-worktree-isolation-title" aria-describedby="hrn-02-worktree-isolation-desc">
<title id="hrn-02-worktree-isolation-title">One working copy per agent, one way back to main</title>
<desc id="hrn-02-worktree-isolation-desc">At the top, the main repository with one object database and one history. Below it, inside a frame labelled files only, three worktrees made by git worktree add, each a separate working copy on its own branch: ../wt-ada on agent/ada, ../wt-linus on agent/linus and ../wt-grace on agent/grace, each edited by its agent alone. Every branch goes down into one merge gate, which lands it on main only if the candidate merge builds and its tests pass. A note says what the worktrees still share: processes, network, environment variables and credentials.</desc>
<style>
