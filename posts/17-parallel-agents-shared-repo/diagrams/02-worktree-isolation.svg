<text x="904" y="116" text-anchor="end" class="t-label f-purple-ink" data-w="94">lands on main</text>
<text x="56" y="412" class="t-note" data-w="200">still shared by every worktree:</text>
<text x="56" y="436" class="t-note" data-w="134">processes, network,</text>
<text x="56" y="460" class="t-note" data-w="230">environment variables, credentials</text>
<text x="40" y="504" class="t-note" data-w="601">A worktree isolates files and nothing else; tasks that run untrusted code need a container.</text>
</svg>
