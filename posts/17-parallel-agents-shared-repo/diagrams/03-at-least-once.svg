  .w075 { stroke-width: 0.75; }
</style>
<defs>
<marker id="hrn-03-at-least-once-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="631">Every claim was exclusive, and task-7 still ran twice</text>
<text x="40" y="76" class="t-subtitle" data-w="707">Computed: snippets/leases.py on the companion's board; simulated seconds, a 900-second lease.</text>
<text x="40" y="172" class="t-head" data-w="63">agent A</text>
<path d="M216,168 L864,168" class="s-grid w075 nofill"/>
<text x="40" y="284" class="t-head" data-w="48">board</text>
