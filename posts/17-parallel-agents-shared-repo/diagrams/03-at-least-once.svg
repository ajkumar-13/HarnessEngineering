<rect x="324" y="244" width="324" height="16" class="f-purple-soft"/>
<rect x="324" y="244" width="324" height="16" class="w1 nofill s-purple" data-fit="skip"/>
<text x="332" y="236" class="t-note" data-w="292">agent A's lease, renewed at 300, runs 900 s</text>
<path d="M540,274 L546,280 L540,286 L534,280 Z" class="f-purple s-surface w1"/>
<path d="M648,274 L654,280 L648,286 L642,280 Z" class="f-purple s-surface w1"/>
<text x="540" y="308" text-anchor="middle" class="t-label" data-w="74">sweep: live</text>
