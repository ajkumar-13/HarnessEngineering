<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-at-least-once-title" aria-describedby="hrn-03-at-least-once-desc">
<title id="hrn-03-at-least-once-title">Every claim was exclusive, and task-7 still ran twice</title>
<desc id="hrn-03-at-least-once-desc">A timeline in simulated seconds from 0 to 1,800 in three lanes. Agent A claims task-7 at 0, renews its 900-second lease at 300 and goes quiet. On the board lane the sweeper finds the lease live at 900 and expired at 1,200, and puts task-7 back in open. Agent B claims it at 1,210, works, and at 1,500 writes settings.toml and completes the task into done. At 1,800 agent A wakes and does the same work, which finds settings.toml unchanged, and its completion is refused because it no longer holds the claim. One task, two executions, one effect.</desc>
