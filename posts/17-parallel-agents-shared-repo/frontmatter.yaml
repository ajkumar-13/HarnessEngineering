id: hrn-017
slug: 17-parallel-agents-shared-repo
title: "17 - Parallel agents on a shared repo: worktrees and task-claiming"
summary: "Many agents can share one repository with no orchestrator: each claims a task by an exclusive file create and edits in its own git worktree, while a merge gate, leases and idempotent work absorb conflicts and tasks that run twice."
date: 2026-08-21
updated: 2026-10-16
status: complete
part: "Part IV - Scale and orchestration"
level: advanced
reading_time: 29
tags: [harness-engineering, scale-and-orchestration, parallel-agents, task-claiming, worktrees, leases, at-least-once]
hero: diagrams/01-shared-repo-swarm.svg
prerequisites: [hrn-016]
code: included
outcomes:
  - id: o1
    text: "Implement task-claiming by exclusive file creation, and test the exactly-once claim with concurrent threads rather than a single-threaded suite."
  - id: o2
    text: "Add leases, reclaim and quarantine to a task board, releasing the claim token so that a reclaimed task can be claimed again."
  - id: o3
    text: "Isolate each agent's edits in a git worktree, and choose between worktrees, clones and containers by where the agents run and what they execute."
  - id: o4
    text: "Gate every merge on the candidate merged result, and size a swarm against the merge gate's ceiling of T/G agents."
  - id: o5
    text: "Design for at-least-once execution with idempotent tasks, a deduplicating gate and a fencing token, since a lease cannot tell a crashed agent from a slow one."
