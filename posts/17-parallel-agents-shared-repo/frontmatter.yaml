slug: 17-parallel-agents-shared-repo
title: "17 · Parallel agents on a shared repo — worktrees and task-claiming"

description: >
  Many agents can work one codebase in parallel without a central orchestrator. They claim
  tasks via files (an exclusive create, so two agents never get the same task) and isolate
  their edits in git worktrees (one working copy per agent, so parallel changes never
  collide).

