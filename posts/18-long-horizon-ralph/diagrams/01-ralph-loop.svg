<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-ralph-loop-title" aria-describedby="hrn-01-ralph-loop-desc">
<title id="hrn-01-ralph-loop-title">The window is thrown away; the disk keeps the work</title>
<desc id="hrn-01-ralph-loop-desc">Top, a green band of four files on disk that survive every reset: the spec, saying what done means, written by a human; handoff.md, where the work stands, rewritten each iteration; status.json, one pass bit per check, written by the gate; and the git history, one commit per iteration. Below, one iteration as four cards left to right: a fresh process with an empty window reads the files; it does one task and commits it; the driver's gate runs every check and writes the pass bits; the process exits and the window is discarded; an arrow runs back to the start. Bottom, four purple diamonds: the driver stops on every check passing, exit (1); 50 iterations, exit (2); 3 rounds with no new commit, exit (4); or spec bytes that moved, spec_moved.</desc>
<style>
  :root {
    --hrn-bg: #FAFAF7;
    --hrn-surface: #FFFFFF;
    --hrn-ink: #1A1A1A;
    --hrn-ink-muted: #5C5C5C;
    --hrn-ink-subtle: #9A9A9A;
    --hrn-border: #D9D9D4;
    --hrn-primary: #5B7FBF;
    --hrn-accent: #D98E5F;
    --hrn-success: #5C9E78;
    --hrn-warn: #B8895A;
    --hrn-alert: #C66B5E;
    --hrn-neutral-1: #EAEAE4;
    --hrn-neutral-2: #CFCFC8;
    --hrn-neutral-3: #8E8E88;
    --hrn-on-fill: #FFFDF9;
    --hrn-on-accent: #1A1A1A;
    --hrn-grid: rgba(26, 26, 26, 0.06);
    --hrn-rule: #8E8E88;
    --hrn-arrow: #6E6E68;
    --hrn-neutral-soft: #F2F2EE;
    --hrn-blue: #0072B2;
    --hrn-blue-ink: #005A8C;
    --hrn-blue-soft: #E3F0F8;
    --hrn-blue-line: #9CC6E0;
    --hrn-orange: #C98500;
    --hrn-orange-ink: #8A5B00;
    --hrn-orange-soft: #FBF0D9;
    --hrn-orange-line: #E5C27A;
    --hrn-green: #008F68;
    --hrn-green-ink: #006B4E;
    --hrn-green-soft: #DFF3EC;
    --hrn-green-line: #8FCDB8;
    --hrn-red: #A8322A;
    --hrn-red-ink: #8F2A23;
    --hrn-red-soft: #F8E3E1;
    --hrn-red-line: #DDA49F;
    --hrn-purple: #A14D8C;
    --hrn-purple-ink: #833E72;
    --hrn-purple-soft: #F4E4EF;
    --hrn-purple-line: #D3A5C6;
  }
