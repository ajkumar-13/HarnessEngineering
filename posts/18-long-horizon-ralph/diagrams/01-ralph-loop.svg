  .s-blue-line { stroke: var(--hrn-blue-line); }
  .s-green { stroke: var(--hrn-green); }
  .s-green-line { stroke: var(--hrn-green-line); }
  .s-orange-line { stroke: var(--hrn-orange-line); }
  .s-purple-line { stroke: var(--hrn-purple-line); }
  .s-surface { stroke: var(--hrn-surface); }
</style>
<defs>
<marker id="hrn-01-ralph-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
<marker id="hrn-01-ralph-loop-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-green"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="640">The window is thrown away; the disk keeps the work</text>
<text x="40" y="76" class="t-subtitle" data-w="683">One task per fresh process against files on disk; after each one the driver checks, then decides.</text>
<rect x="40" y="112" width="880" height="180" rx="8" class="f-green-soft s-green-line w1"/>
<text x="56" y="140" class="t-head" data-w="236">On disk: survives every reset</text>
<rect x="56" y="160" width="200" height="116" rx="8" class="card"/>
<text x="72" y="192" class="t-head" data-w="70">the spec</text>
<text x="72" y="224" class="t-label" data-w="123">what done means;</text>
<text x="72" y="248" class="t-label" data-w="115">a human writes it</text>
<rect x="272" y="160" width="200" height="116" rx="8" class="card"/>
<text x="288" y="192" class="t-head" data-w="94">handoff.md</text>
<text x="288" y="224" class="t-label" data-w="155">where the work stands;</text>
<text x="288" y="248" class="t-label" data-w="155">rewritten each iteration</text>
<rect x="488" y="160" width="200" height="116" rx="8" class="card"/>
<text x="504" y="192" class="t-head" data-w="91">status.json</text>
<text x="504" y="224" class="t-label" data-w="155">one pass bit per check;</text>
<text x="504" y="248" class="t-label" data-w="113">the gate writes it</text>
<rect x="704" y="160" width="200" height="116" rx="8" class="card"/>
<text x="720" y="192" class="t-head" data-w="84">git history</text>
<text x="720" y="224" class="t-label" data-w="98">the work itself;</text>
<text x="720" y="248" class="t-label" data-w="165">one commit per iteration</text>
<rect x="40" y="368" width="196" height="108" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="56" y="400" class="t-head" data-w="109">fresh context</text>
<text x="56" y="432" class="t-label" data-w="101">a new process,</text>
<text x="56" y="456" class="t-label" data-w="117">an empty window</text>
<rect x="268" y="368" width="196" height="108" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="284" y="400" class="t-head" data-w="70">one task</text>
<text x="284" y="432" class="t-label" data-w="121">build it, commit it,</text>
<text x="284" y="456" class="t-label" data-w="127">rewrite the handoff</text>
<rect x="496" y="368" width="196" height="108" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="512" y="400" class="t-head" data-w="67">the gate</text>
<text x="512" y="432" class="t-label" data-w="137">the driver runs every</text>
<text x="512" y="456" class="t-label" data-w="141">check, writes the bits</text>
<rect x="724" y="368" width="196" height="108" rx="8" class="card"/>
<text x="740" y="400" class="t-head" data-w="42">reset</text>
<text x="740" y="432" class="t-label" data-w="118">the process exits;</text>
<text x="740" y="456" class="t-label" data-w="161">the window is discarded</text>
<path d="M236,424 L265,424" class="flow" marker-end="url(#hrn-01-ralph-loop-arrow)"/>
<path d="M464,424 L493,424" class="flow" marker-end="url(#hrn-01-ralph-loop-arrow)"/>
<path d="M692,424 L721,424" class="flow" marker-end="url(#hrn-01-ralph-loop-arrow)"/>
<path d="M824,476 L824,516 L136,516 L136,479" class="flow" marker-end="url(#hrn-01-ralph-loop-arrow)"/>
<text x="144" y="508" class="t-note" data-w="160">repeat, carrying nothing</text>
<path d="M112,292 L112,365" class="s-green w15 nofill" marker-end="url(#hrn-01-ralph-loop-arrow-green)"/>
<text x="124" y="336" class="t-note f-green-ink" data-w="88">reads all four</text>
<path d="M368,368 L368,295" class="s-green w15 nofill" marker-end="url(#hrn-01-ralph-loop-arrow-green)"/>
<text x="380" y="336" class="t-note f-green-ink" data-w="110">handoff, commit</text>
<path d="M592,368 L592,295" class="s-green w15 nofill" marker-end="url(#hrn-01-ralph-loop-arrow-green)"/>
<text x="604" y="336" class="t-note f-green-ink" data-w="61">pass bits</text>
<text x="740" y="336" class="t-note" data-w="109">nothing goes up</text>
<text x="40" y="576" class="t-head" data-w="158">The driver stops on</text>
<path d="M52,598.4 L61.6,608 L52,617.6 L42.4,608 Z" class="f-purple s-surface w1"/>
<text x="72" y="612" class="t-label" data-w="130">every check passes</text>
<text x="72" y="636" class="t-label f-purple-ink" data-w="47">exit (1)</text>
<path d="M280,598.4 L289.6,608 L280,617.6 L270.4,608 Z" class="f-purple s-surface w1"/>
<text x="300" y="612" class="t-label" data-w="84">50 iterations</text>
<text x="300" y="636" class="t-label f-purple-ink" data-w="47">exit (2)</text>
<path d="M508,598.4 L517.6,608 L508,617.6 L498.4,608 Z" class="f-purple s-surface w1"/>
<text x="528" y="612" class="t-label" data-w="138">3 rounds, no commit</text>
<text x="528" y="636" class="t-label f-purple-ink" data-w="47">exit (4)</text>
<path d="M736,598.4 L745.6,608 L736,617.6 L726.4,608 Z" class="f-purple s-surface w1"/>
<text x="756" y="612" class="t-label" data-w="122">spec bytes moved</text>
<text x="756" y="636" class="t-code f-purple-ink" data-w="86">spec_moved</text>
<text x="40" y="684" class="t-note" data-w="499">Only the files cross the reset, and only the driver decides the work is done.</text>
</svg>
