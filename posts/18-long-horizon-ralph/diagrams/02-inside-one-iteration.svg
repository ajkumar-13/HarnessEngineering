<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-inside-one-iteration-title" aria-describedby="hrn-02-inside-one-iteration-desc">
<title id="hrn-02-inside-one-iteration-title">Stable first: the frozen prefix, then what moved</title>
<desc id="hrn-02-inside-one-iteration-desc">Left, one iteration's context as a stack read top to bottom. PROMPT.md, the system prompt, and the spec are bracketed as the frozen prefix, 208 tokens in the snippet's toy build and byte-identical in every iteration, so a prompt cache can serve them. Below them status.json, handoff.md, the git log and the source file are bracketed as volatile, 28 to 137 tokens at re-entry, rebuilt every time; last comes the iteration's own work. Right, a table of who may write each file: the spec, a human between runs; status.json, only the gate; handoff.md, the loop, rewritten whole; the source, the loop, one commit per iteration.</desc>
