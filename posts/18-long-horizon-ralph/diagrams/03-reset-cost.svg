<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-reset-cost-title" aria-describedby="hrn-03-reset-cost-desc">
<title id="hrn-03-reset-cost-title">A cold re-entry pays a write and collects no read</title>
<desc id="hrn-03-reset-cost-desc">Two computed bar charts of what a 12,000-token frozen prefix costs over 50 iterations at $3 per million input tokens. Left, the re-entry call of each iteration only: no cache $1.80; five-minute tier with reads under five minutes apart, warm, $0.22; five-minute tier with about eight minutes between reads, cold, $2.25, in red; one-hour tier $0.25. Right, with 20 calls inside each iteration: $36.00, $3.64, $5.67 and $3.67.</desc>
