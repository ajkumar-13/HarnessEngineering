<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-04-multi-context-run-title" aria-describedby="hrn-04-multi-context-run-desc">
<title id="hrn-04-multi-context-run-title">The window resets; the work only climbs</title>
<desc id="hrn-04-multi-context-run-desc">Two computed charts of the snippet's honest run over four iterations. Top, tokens in the window: each iteration rises from its re-entry context, 236, 315, 338 and 345 tokens, to its end, 307, 401, 423 and 449, and the window is discarded at the reset; a dotted line marks the 208-token frozen prefix every re-entry starts from; a dashed muted line shows one context carrying every iteration, growing to 956. Bottom, two staircases: commits rise by one every iteration from 1 to 5, while criteria passing the gate go 0, 1, 1, 2, 3, flat at iteration 2 where the agent's claim failed the gate.</desc>
