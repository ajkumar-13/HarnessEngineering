title: "18 - Long-horizon and multi-context execution: Ralph loops and context bridging"
summary: "Work bigger than one window runs as a Ralph loop: a fresh context per task against a spec on disk, a cached frozen prefix, and a driver whose gate and guards decide when to stop."
