outcomes:
  - id: o1
    text: "Recognise work that has outgrown one context window, and run a Ralph loop: fresh context, written spec, one task, commit, repeat."
  - id: o2
    text: "Size one iteration to one verifiable increment, and price its re-entry tax against the prompt cache's tiers and its clock."
  - id: o3
    text: "Bridge contexts with a read-only spec and a handoff file, and keep the definition of done out of the agent's reach."
  - id: o4
    text: "Enforce convergence with a gate the driver runs, and stop a loop on an iteration cap, a stale-commit count or a moved spec."
  - id: o5
    text: "Design a multi-context build with an initialiser and an end-to-end gate, and plan the review of the commits it leaves."
