title: "18 · Long-horizon & multi-context execution — Ralph loops and context bridging"

description: >
  Some tasks are bigger than any single context window, no matter how well you manage it.
  The answer is not a bigger window but the Ralph loop: reset to a fresh context against a
  written spec, do one task, commit, and repeat, with all the state living on disk.

