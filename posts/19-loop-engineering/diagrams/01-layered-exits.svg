      --hrn-green: #3CC497;
      --hrn-green-ink: #62D1AC;
      --hrn-green-soft: #10302A;
      --hrn-green-line: #2A6A55;
      --hrn-red: #E8796E;
      --hrn-red-ink: #F09A90;
