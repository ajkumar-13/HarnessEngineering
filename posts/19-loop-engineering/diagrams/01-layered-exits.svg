<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-layered-exits-title" aria-describedby="hrn-01-layered-exits-desc">
<title id="hrn-01-layered-exits-title">Four layered exits: one intended, three guards</title>
<desc id="hrn-01-layered-exits-desc">One turn of the agent loop from left to right. Before the model call, two purple checks: turns left, whose exit is (2), iteration cap, and the reserve check, whose exit is (3), budget, taken when the next call would cross the ceiling. Then reason, the model call, in blue. After the call a purple check leads to (1), final answer, which a verification gate must confirm, and to (4), no progress, the same calls 3 turns running; otherwise the turn goes on to act in orange and observe in green, and the next call carries the whole history back to the start. Exit (1) leaves the result; exits (2), (3) and (4) each leave a handoff to resume from. A red dashed path shows a doom loop without exit (4) running on to the iteration cap.</desc>
<style>
