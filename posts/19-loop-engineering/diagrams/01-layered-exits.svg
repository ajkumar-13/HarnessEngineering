<path d="M56,232 L125,232" class="flow" marker-end="url(#hrn-01-layered-exits-arrow)"/>
<text x="448" y="132" text-anchor="middle" class="t-note" data-w="153">next call, whole history</text>
<rect x="40" y="440" width="208" height="108" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="56" y="472" class="t-head" data-w="130">(2) iteration cap</text>
<text x="56" y="504" class="t-note" data-w="81">no turns left</text>
<text x="56" y="528" class="t-note" data-w="111">leaves a handoff</text>
<rect x="264" y="440" width="208" height="108" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="280" y="472" class="t-head" data-w="85">(3) budget</text>
<text x="280" y="504" class="t-note" data-w="140">next call would cross</text>
<text x="280" y="528" class="t-note" data-w="111">leaves a handoff</text>
<rect x="488" y="440" width="208" height="108" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="504" y="472" class="t-head" data-w="126">(1) final answer</text>
<text x="504" y="504" class="t-note" data-w="116">verified by a gate</text>
<text x="504" y="528" class="t-note" data-w="110">leaves the result</text>
<rect x="712" y="440" width="208" height="108" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="728" y="472" class="t-head" data-w="125">(4) no progress</text>
<text x="728" y="504" class="t-note" data-w="125">same calls, 3 turns</text>
<text x="728" y="528" class="t-note" data-w="111">leaves a handoff</text>
