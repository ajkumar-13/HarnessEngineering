<text x="600" y="260" class="t-note" data-w="85">run the tools</text>
<rect x="776" y="196" width="136" height="72" rx="8" class="f-green-soft s-green-line w1"/>
<text x="792" y="228" class="t-head" data-w="65">observe</text>
<text x="792" y="260" class="t-note" data-w="100">append results</text>
<path d="M144,217.6 L158.4,232 L144,246.4 L129.6,232 Z" class="f-purple s-surface w1"/>
