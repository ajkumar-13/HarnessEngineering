<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="562">Four layered exits: one intended, three guards</text>
<text x="40" y="76" class="t-subtitle" data-w="702">Checked in this order every turn: the cap and the reserve before the model call, (1) and (4) after it.</text>
<rect x="288" y="196" width="136" height="72" rx="8" class="f-blue-soft s-blue-line w1"/>
