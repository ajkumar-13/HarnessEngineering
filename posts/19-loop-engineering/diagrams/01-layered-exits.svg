<path d="M816,548 L816,604" class="s-red w15 nofill d-proj"/>
<path d="M816,604 L144,604" class="s-red w15 nofill d-proj"/>
<path d="M144,604 L144,551" class="s-red w15 nofill d-proj" marker-end="url(#hrn-01-layered-exits-arrow-red)"/>
<text x="480" y="632" text-anchor="middle" class="t-label f-red-ink" data-w="420">without (4), a doom loop repeats the same call until (2) stops it</text>
<text x="40" y="684" class="t-note" data-w="642">Only (1) means the work is done; a run caught by (2), (3) or (4) leaves a handoff to resume from.</text>
</svg>
