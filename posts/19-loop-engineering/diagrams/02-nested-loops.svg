<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-nested-loops-title" aria-describedby="hrn-02-nested-loops-desc">
<title id="hrn-02-nested-loops-title">The inner loop gets a step right; the outer advances</title>
<desc id="hrn-02-nested-loops-desc">An outer task loop, post 18's, drawn as a frame: pick the next task, run the inner loop, check its outcome, and either commit and advance or count the task as unverified, then take the next task in a fresh context. Inside it, the inner verify loop of post 11: generate a candidate in blue, verify it at a purple gate, and on a failure send the report back in red; it reports an outcome after a pass or after 5 attempts. Three unverified outcomes in a row are exit (4) for the outer loop. Below, one run budget feeds both loops: a fixed share per task, or a shared pool with a per-task cap.</desc>
