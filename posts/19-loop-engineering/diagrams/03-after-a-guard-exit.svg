text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="8.5" fill="var(--ce-ink-subtle)">IF YOU SKIP IT</text><text xml:space="preserve" x="656" y="376.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ce-alert)">You pay the wall-clock between the stall</text><text xml:space="preserve" x="656" y="390.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ce-alert)">and the discovery, often more than the run.</text><text xml:space="preserve" x="40" y="436.58" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11.5" fill="var(--ce-ink)">The rule of thumb: the intended exit returns a result; a guard exit returns a result and a resumable position.</text><text xml:space="preserve" x="40" y="458.58" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11.5" fill="var(--ce-ink-muted)">And check the budget before the call that would breach it, or the ceiling is a notification rather than a ceiling.</text>
</svg>
