<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">What a guard exit must leave behind, against what the intended exit returns</title>
  <desc id="d">A hand-drawn figure. Two bands compare the exits. The first, the verifier confirming the goal, is the intended exit and the only one that means success; it returns a result. The second, covering max iterations, budget spent and no progress, means the run did not finish and something caught it; it returns a result and a resumable position. Below, three panels give what a guard exit should do before it returns, each with what happens if you skip it. Checkpoint the work: a run stopped at the ceiling has produced real partial progress in commits, files and half-finished refactors, and durable state makes it resumable, so skipping it forfeits the whole spend, which is odd from a guard whose purpose was to save it. Say what it was doing: the stop reason is necessary but not sufficient, and a message such as over-budget at iteration twelve plus the handoff file giving what is done, what was next and what was blocked is the difference between resuming in a minute and a human re-deriving the state from a trace. Escalate if it warrants it: no-progress and budget-exhausted are exactly the escalation triggers of post 15, and a loop that stops silently waits to be noticed, so skipping it means paying the wall-clock between the stall and the discovery, often more than the run itself. Captions record the rule of thumb, that the intended exit returns a result while a guard exit returns a result and a resumable position, and that the budget should be checked before the call that would breach it, or the ceiling is a notification rather than a ceiling.</desc>

