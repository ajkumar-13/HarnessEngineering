d refactor. Durable state (Post 08)</text><text xml:space="preserve" x="56" y="331.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ce-ink)">makes it resumable: raise the ceiling and go.</text><path d="M55.83 344.23C143.69 344.19 230.61 344.13 304.1 344.33M56.22 343.77C142.83 344.04 229.52 344.12 303.99 343.84" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="56" y="359.82" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="8.5" fill="var(--ce-ink-subtle)">IF YOU SKIP IT</text><text xml:space="preserve" x="56" y="376.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ce-alert)">The whole spend is forfeit, which is odd</text><text xml:space="preserve" x="56" y="390.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ce-alert)">from a guard whose purpose was to save it.</text><path d="M362.96 250.95C429.59 250.96 492.66 248.29 595.13 250.76C611.6 250.71 617.66 259.85 618.76 271.7C617.12 299.83 618.05 331.59 621.38 381.78C619.58 398.54 613.18 408.07 597.72 407.47C511.09 406.97 423.71 406.99 365.43 405.69C345.65 405.92 338.38 399.21 338.39 380.91C337.53 348.74 342.15 314.34 341.8 274.13C340.62 258.34 348.39 247.71 363.97 247.49C364 250 364 250 364 250" fill="var(--ce-surface)" stroke="none"/><path d="M365.69 250.82C433.16 249.25 501.83 251.3 594.73 250.81M363.8 250.43C431.96 248.48 499.73 247.97 596.02 249.61M596 250C613.66 251.73 618.48 256.57 620.43 275.82M594.61 250.92C612.12 248.74 620.2 258.35 619.61 274.28M620.22 273.09C621.58 311.6 619.92 346.54 620.54 381.66M620.07 273.5C619.41 313.36 619.71 350.83 619.84 382.51M620 382C618.79 396.68 613.5 407.43 595.4 407.85M619.04 3