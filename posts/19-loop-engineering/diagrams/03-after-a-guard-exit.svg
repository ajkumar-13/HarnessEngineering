<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-after-a-guard-exit-title" aria-describedby="hrn-03-after-a-guard-exit-desc">
<title id="hrn-03-after-a-guard-exit-title">A guard exit hands off; a fresh run finishes</title>
<desc id="hrn-03-after-a-guard-exit-desc">Input tokens sent on each model call of two runs, one bar per call. Run 1 makes 10 calls, rising from 6,000 to 33,900 tokens; call 4 is retried twice after a rate limit and an overload. Call 11, which would send 37,000, is drawn dashed in red: the purple reserve check refuses it at 199,500 tokens spent against a ceiling of 200,000, exit (3), budget. A green handoff file records modules m01 to m10 done and m11 to m13 next. Run 2, a fresh context built from the file, makes 4 calls from 6,000 to 15,300 tokens, 42,600 in all, and ends on exit (1).</desc>
