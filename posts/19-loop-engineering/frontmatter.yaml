code: included
outcomes:
  - id: o1
    text: "Give a loop four layered exits in the order they are checked, one intended and three guards, and say what each guard exit must leave behind."
  - id: o2
    text: "Reserve budget before the call that would breach a ceiling, and treat a transient failure as a retry with backoff rather than as an exit."
  - id: o3
    text: "Choose what a no-progress detector compares, a tool-call signature, an effect on disk or a verifier score, from the stall it has to catch."
  - id: o4
    text: "Compose an inner verification loop inside an outer task loop, deciding each exit and the split of one budget at both scales."
  - id: o5
    text: "Turn a guard exit into a handoff a second run resumes from, and place per-run, per-period and per-fleet ceilings on spend."
