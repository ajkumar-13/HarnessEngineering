title: "19 · Loop engineering — designing the loop that prompts the agent"

description: >
  The 2026 shift is from prompting the agent to designing the loop that prompts it for
  you. A well-engineered loop carries layered exits so it stops for the right reason: the
  verifier confirms the goal, or a hard iteration cap, a token/time budget, or no-progress
  detection catches it first.

