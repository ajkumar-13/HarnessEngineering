title: "19 - Loop engineering: designing the loop that prompts the agent"
summary: "A well-engineered loop carries layered exits: a verified final answer and three guards (an iteration cap, a budget reserved before it is spent, no-progress detection), each of which leaves a handoff a second run can resume from."
date: 2026-08-29
