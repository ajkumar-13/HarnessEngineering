<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-sdk-feature-matrix-title" aria-describedby="hrn-01-sdk-feature-matrix-desc">
<title id="hrn-01-sdk-feature-matrix-title">What each shape ships, as documented</title>
<desc id="hrn-01-sdk-feature-matrix-desc">A matrix, illustrative and dated October 2026. Columns: the Claude Agent SDK, batteries-included; the OpenAI Agents SDK, code-first; LangGraph, a graph framework; the Codex harness, an open engine. Rows, with each cell marked built in (a solid dot), partial (a hollow dot) or the team builds it (a dash): loop: Claude Agent SDK built in (agent loop), OpenAI Agents SDK built in (built-in loop), LangGraph the team builds it (the team draws it), Codex harness built in (agent loop); state: Claude Agent SDK built in (sessions, forks), OpenAI Agents SDK built in (sessions), LangGraph built in (checkpointers), Codex harness built in (threads, forks); context management: Claude Agent SDK built in (auto compaction), OpenAI Agents SDK partial (opt-in compaction), LangGraph the team builds it (the team builds it), Codex harness built in (thread compaction); hooks: Claude Agent SDK built in (lifecycle hooks), OpenAI Agents SDK built in (tool guardrails), LangGraph the team builds it (a node of its own), Codex harness built in (lifecycle hooks); permissions: Claude Agent SDK built in (rules and modes), OpenAI Agents SDK partial (approval per tool), LangGraph partial (interrupt()), Codex harness built in (sandbox, approvals); orchestration: Claude Agent SDK built in (subagents), OpenAI Agents SDK built in (handoffs), LangGraph partial (topology by hand), Codex harness built in (subagents).</desc>
<style>
