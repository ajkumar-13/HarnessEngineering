<text x="40" y="48" class="t-title" data-w="562">Who owns the loop, and whose models it runs</text>
<text x="40" y="76" class="t-subtitle" data-w="722">Each option placed by what its documentation said in October 2026; cells are categories, not scores.</text>
<text x="232" y="120" class="t-head" data-w="197">the team draws the loop</text>
<text x="592" y="120" class="t-head" data-w="215">the product ships the loop</text>
