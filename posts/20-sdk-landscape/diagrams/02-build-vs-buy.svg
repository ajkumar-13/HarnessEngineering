<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-build-vs-buy-title" aria-describedby="hrn-02-build-vs-buy-desc">
<title id="hrn-02-build-vs-buy-title">Who owns the loop, and whose models it runs</title>
<desc id="hrn-02-build-vs-buy-desc">Two axes and four cells. Across: the team draws the loop, or the product ships the loop. Down: one provider's models by default, or any provider's models. The product ships the loop and runs one provider's models: the Claude Agent SDK, Claude models through several clouds, and the Codex harness, OpenAI by default with other providers configured. The product ships the loop and runs any provider's models: the OpenAI Agents SDK, other providers through integration points. The team draws the loop over any provider's models: LangGraph, any model a node calls, and a harness of one's own, any model behind a seam. The team draws the loop over one provider: a loop over one client SDK, as this series' builds are, behind a model seam.</desc>
