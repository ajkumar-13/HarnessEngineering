<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-03-harness-ab-title" aria-describedby="hrn-03-harness-ab-desc">
<title id="hrn-03-harness-ab-title">A real lift of 6.2 points, measured as 1.0</title>
<desc id="hrn-03-harness-ab-desc">Two panels computed by the post's A/B snippet, illustrative. Left, twenty tasks as rows, each a dot at harness B's resolved count minus harness A's, out of five seeds, on an axis from minus 3 to plus 3 with a line at no difference: t00 0, t01 0, t02 0, t03 −1, t04 0, t05 −2, t06 0, t07 0, t08 0, t09 +1, t10 +1, t11 0, t12 +2, t13 −1, t14 0, t15 0, t16 −1, t17 +2, t18 −1, t19 +1; five rows favour B, five favour A and ten tie. Right, the measured lift of +1.0 points with its 95 percent interval from −8.3 to +10.3 points, crossing zero, and the true lift of +6.2 points the stand-in was built with. Below: A resolved 66 of 100 runs and B 67; about 83 tasks would detect the true lift four times in five.</desc>
