title: "20 · The SDK & framework landscape — Agent SDK, LangGraph, and peers"

description: >
  You rarely build a harness fully from scratch in production. An agent software
  development kit (SDK) is a prebuilt harness: it ships the loop, tools, context
  management, hooks and permissions of Parts I to III, plus the sub-agents of Post 16 and
  some of the observability of Post 21, and you supply the custom layer.

