<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-trace-tree-title" aria-describedby="hrn-01-trace-tree-desc">
<title id="hrn-01-trace-tree-title">The root says why it ended; each tool span, who decided</title>
<desc id="hrn-01-trace-tree-desc">A waterfall of the 19 spans of run 1 of trace_loop.py on a time axis from 0 to 18 simulated seconds. The root agent.run lasts 17.92 seconds and carries stop.reason completed. Six iterations follow, each opening with a model call whose input tokens are 6,000, 9,100, 12,200, 15,300, 18,400 and 21,500. The first five each have a tool span: read_file ok, bash blocked by the hook, bash refused by the sandbox, run_tests ok, which takes 7.80 seconds and is edged in red as the latency outlier, and deploy denied by the approver. A purple verify.gate span of 1.20 seconds passes after the final answer.</desc>
