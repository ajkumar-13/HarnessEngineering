<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-trace-to-ratchet-title" aria-describedby="hrn-03-trace-to-ratchet-desc">
<title id="hrn-03-trace-to-ratchet-title">The trace names the component; the ratchet keeps the fix</title>
<desc id="hrn-03-trace-to-ratchet-desc">Three panels joined by arrows. Trace: run 3 of trace_loop.py, a root ending max_iters after 12 iterations and 276,600 input tokens, its twelve read_file calls on src/parser.py identical, the repeats from iteration 2 edged in red. Localise: the repeated signature is owned by component 01, the loop, whose exit (4) was off; with it on, the same script stops at iteration 3 on no_progress at 27,300 tokens. Ratchet: three teeth, a green memory line to change approach when a call repeats, a purple pre-tool hook that refuses a third identical call, and a purple reviewer check that replays run 3 and requires it to stop by iteration 3.</desc>
