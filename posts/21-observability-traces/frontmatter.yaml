slug: 21-observability-traces
title: "21 · Observability & trace-driven repair — seeing what the harness did"

description: >
  You cannot improve a harness you cannot see. A production run takes dozens of model
  calls and tool calls, and when one goes wrong the useful question is never "is the model
  bad": it is which component failed, on which step, and why. The answer lives in a trace,
  a tree of timed, nested spans covering every iteration, model call, tool call and
  sub-agent.

