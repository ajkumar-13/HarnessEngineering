outcomes:
  - id: o1
    text: "Instrument a loop so every run emits nested spans with a stop reason on the root and the deciding gate's outcome on every tool span."
  - id: o2
    text: "Read the geometry of a trace tree and localise a failure to the harness component that owns its fix."
  - id: o3
    text: "Carry a span context across a process boundary with a W3C traceparent, and use a span link for work that outlives its parent."
  - id: o4
    text: "Replay a recorded run against a changed harness, choose what happens at the first divergence, and grow a regression set from real failures."
  - id: o5
    text: "Set sampling, retention and access for traces, and keep an agent that reads traces to proposing fixes rather than applying them."
