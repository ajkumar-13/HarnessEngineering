<text x="40" y="48" class="t-title" data-w="663">An output eval scores an answer; a harness eval, a run</text>
<text x="40" y="76" class="t-subtitle" data-w="680">The trajectory eval reads the path the run took; the outcome eval reads the world it left behind.</text>
<text x="40" y="136" class="t-head" data-w="198">Output eval: one answer</text>
