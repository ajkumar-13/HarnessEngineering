<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-output-vs-trajectory-title" aria-describedby="hrn-01-output-vs-trajectory-desc">
<title id="hrn-01-output-vs-trajectory-title">An output eval scores an answer; a harness eval, a run</title>
<desc id="hrn-01-output-vs-trajectory-desc">Two panels. Left, an output eval: a prompt leads to one completion, in blue, which a rubric or a judge scores; the score is blind to how the answer was reached. Right, one agent run drawn as five turns, each a column of reason in blue, act in orange and observe in green; the observation of turn 3 is red, a test that fails, and the run recovers. After turn 5 a purple verification gate passes and the run takes exit (1), completed. A brace over the turns reads: the trajectory eval reads the path, its turns, tokens, gate fires and stop reason. Below the run, a green card for the workspace the run left, tests pass, and an arrow from the outcome eval, which reads it.</desc>
<style>
