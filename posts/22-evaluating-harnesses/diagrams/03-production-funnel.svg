<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-production-funnel-title" aria-describedby="hrn-03-production-funnel-desc">
<title id="hrn-03-production-funnel-title">B wins the first pass and loses the ledger</title>
<desc id="hrn-03-production-funnel-desc">Three stages narrowing from left to right for one illustrative week of two harnesses: runs attempted, A 200 and B 200; results accepted without rework, A 118 and B 132; work shipped, A 109 and B 118. A purple gate sits on each arrow: human review, giving first-pass success of 59% against 66%, and the later revert, giving defect escape of 7.6% against 10.6%. A ledger below: model spend $170 and $510, human time $5,170 and $5,900, dollars per merged pull request 48.99 for A and 54.32 for B. B's nine extra merges cost about 119 dollars each.</desc>
<style>
