title: "22 · Evaluating harnesses — Terminal-Bench, SWE-bench, harness A/B"

description: >
  Harness quality is not measured on single outputs; it is measured on whole trajectories
  and their outcomes. The question is not "was that a good answer" but "did the run
  resolve the task", scored across a fixed set of real jobs and repeated often enough to
  see the spread.

