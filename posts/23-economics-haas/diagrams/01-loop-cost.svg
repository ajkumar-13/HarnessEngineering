<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-loop-cost-title" aria-describedby="hrn-01-loop-cost-desc">
<title id="hrn-01-loop-cost-title">Uncached, a run's bill grows with the square of its length</title>
<desc id="hrn-01-loop-cost-desc">A line chart of cumulative dollars against loop iterations 1 to 40 for the series' illustrative running example at Claude Sonnet 4.6 rates, computed by the post's snippet. Uncached, the dashed line curves upward to 0.94 dollars at 12 iterations and 8.33 at 40. A cached static head of 5,000 tokens runs just below it, 0.79 and 7.81. A rolling breakpoint, in green, rises almost straight, 0.33 at 12 and 1.60 at 40.</desc>
