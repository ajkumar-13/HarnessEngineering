<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-02-llm-api-vs-haas-title" aria-describedby="hrn-02-llm-api-vs-haas-desc">
<title id="hrn-02-llm-api-vs-haas-title">Renting the loop moves it inside the vendor's boundary</title>
<desc id="hrn-02-llm-api-vs-haas-desc">Three columns, each with the vendor's boundary drawn as a purple frame. Model API: only the model is inside; the team builds the loop, tools, hooks, context management and state; it bills tokens. SDK the team hosts: only the model is inside; the team runs the vendor's SDK, which supplies the loop, tools, hooks and context management; it bills tokens plus the team's own compute. Hosted runtime: the model, the loop, tools, hooks, context management and state are all inside; the team sends a task in and gets an agent run out; it bills tokens plus runtime.</desc>
