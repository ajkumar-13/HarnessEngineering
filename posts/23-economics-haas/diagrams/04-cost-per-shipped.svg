<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-04-cost-per-shipped-title" aria-describedby="hrn-04-cost-per-shipped-desc">
<title id="hrn-04-cost-per-shipped-title">Per unit shipped, the tokens are the thin part</title>
<desc id="hrn-04-cost-per-shipped-desc">A computed stacked bar chart of dollars per unit of work shipped for two illustrative harnesses. Harness A, with no verification gate: 0.8 dollars of model tokens and 31.4 of a person's review, 32.2 in all. Harness B, with a gate on every step: 0.6 of model tokens and 9.4 of review, 10.0 in all.</desc>
<style>
