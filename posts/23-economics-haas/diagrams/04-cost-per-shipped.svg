<text x="40" y="48" class="t-title" data-w="546">Per unit shipped, the tokens are the thin part</text>
<text x="40" y="76" class="t-subtitle" data-w="713">Computed by snippets/run_meter.py; illustrative inputs, review priced at a placeholder $90 an hour.</text>
