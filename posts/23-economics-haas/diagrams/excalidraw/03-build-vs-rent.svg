<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" role="img" aria-labelledby="t d">
  <title id="t">Three questions that decide whether to build a harness or rent one</title>
  <desc id="d">A hand-drawn figure of three questions, each with the case for renting and the case for building. Volume: a rented runtime carries a per-run margin on the loop machinery, so rent at a few thousand runs a month where renting saves months of engineering, and build at millions of runs where the aggregate margin exceeds the cost of a team owning the harness outright; the crossover is arithmetic once you have a per-run cost model. Control: a rented harness is a fixed loop with a fixed set of hook points, so rent when the vendor loop, context strategy and hooks already cover your task without contortions, and build when you need a bespoke stop condition, a custom verification gate, or a context strategy nobody exposes; the more your value lives in the harness, the more you build. Differentiation, marked as the deciding question: is the harness the thing your customers are actually paying for? Rent when it is undifferentiated plumbing under a product whose value lies elsewhere; build when it is your product, because renting it means renting your moat from a supplier who also rents it to your competitors. Captions record that you should build what differentiates you and rent what does not, one component at a time, that the cost model is the same either way so you can meter a run before deciding, and that iterations multiply the bill while the discount on the re-read prefix decides whether a run ships.</desc>

