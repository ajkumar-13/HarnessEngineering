slug: 23-economics-haas
title: "23 · The economics of a harness & Harness-as-a-Service"

description: >
  A single completion has one price; an agentic run has that price multiplied by the
  number of loop iterations, and each iteration re-reads a context that grows every step.
  Harness economics are dominated by two levers: how many times the loop turns, and how
  cheaply the accumulated history is re-read.

