<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-01-minimal-architecture-title" aria-describedby="hrn-01-minimal-architecture-desc">
<title id="hrn-01-minimal-architecture-title">Build #1 is four primitives in 451 lines</title>
<desc id="hrn-01-minimal-architecture-desc">The engine of Build #1 as a component map. At the centre, component 01, the loop, in harness.py (108 lines): reason, act, observe, joined clockwise. On the left, the model seam, models.py (108 lines), a scripted model in tests and the Anthropic adapter live, answers each call; below it, component 06, verification, verify.py (75 lines), receives every final answer and sends a failure report back into the loop. On the right, component 02, tools, tools.py (160 lines), validates each call before dispatch to bash, with 8 deny patterns, or write_file, and returns an observation. Along the bottom the loop's four exits: (1) completed, when the gate passes; (2) max_iters, 12 by default; (3) budget, token_budget reached; (4) no_progress, 3 identical turns of tool calls.</desc>
