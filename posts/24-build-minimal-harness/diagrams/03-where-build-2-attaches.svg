<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-where-build-2-attaches-title" aria-describedby="hrn-03-where-build-2-attaches-desc">
<title id="hrn-03-where-build-2-attaches-title">Build #2 adds its gates to the same tool-call path</title>
<desc id="hrn-03-where-build-2-attaches-desc">Two lanes of one tool-call path: model, loop, registry, bash tool, runner. Top, Build #1: the registry validates the call, the bash tool checks 8 deny-list patterns, and the runner executes the string with shell=True. Bottom, Build #2: 1, a pre-tool hook that can block, and 2, an approval gate for sensitive calls, sit on the arrow from the loop to the registry, in the order its _gated_dispatch checks them; 3, a sandbox frame around the bash tool, whose allow-list is echo, ls, cat and git, and a runner that executes an argument list without a shell; 4, a delegate tool in the registry that runs a sub-agent in its own loop; and a brace under the lane for the tracer, one span per run, iteration and call.</desc>
