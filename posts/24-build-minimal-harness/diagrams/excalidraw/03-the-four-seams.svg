<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" role="img" aria-labelledby="t d">
  <title id="t">The four injected seams of the minimal harness and the cost of swapping each</title>
  <desc id="d">A hand-drawn four-row table of the seams that make Build number one swappable, with columns for the seam, what the tests inject, what production injects, and what the swap widens. The model seam takes a ScriptedModel replaying a fixed list of replies in tests and an AnthropicModel plus an install and a key in production, which makes the run non-deterministic and metered. The shell-runner seam, drawn with a heavier border and marked WIDEST, takes a function returning a canned string in tests, starting no process, and subprocess_runner with a real shell in production, after which commands execute for real behind eight regular expressions that are a pre-filter rather than a boundary. The workspace seam takes a dictionary of path to text in tests, touching nothing on disk, and has no shipped live implementation, so you write the durable one yourself; files then outlive the run and can be overwritten or deleted. The verifier seam takes python_function_tests in-process and instant, and a shell-out to the project suite in production, costing seconds per gate call and needing a timeout. An arrow between the two middle columns marks the swap on every row. A closing line records that three seams swap in one file you write yourself, the workspace is the one Build number two has to supply, and that cheap to swap is not the same as safe to swap.</desc>

