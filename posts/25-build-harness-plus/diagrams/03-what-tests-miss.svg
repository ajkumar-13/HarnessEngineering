<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-what-tests-miss-title" aria-describedby="hrn-03-what-tests-miss-desc">
<title id="hrn-03-what-tests-miss-title">Each test passed; each defect sat next door</title>
<desc id="hrn-03-what-tests-miss-desc">Three rows, one per defect, with four columns: the layer, what the suite asserted and passed, the defect in the neighbouring property, and the gap. Sandbox allow-list, fixed: the tests asserted refusals and allowances; a shell ran the raw string, so one echo ran two commands; expected traffic only. Tracer, fixed: the tests asserted the shape of the span tree; every sandbox refusal was tagged ok; shape, never contents. Deny-list hook, still in the code: the tests sent the phrases the patterns were written from; rm -fr / and git push -f walk past it; its own source.</desc>
