<text x="744" y="300" class="t-label" data-w="149">shape, never contents</text>
<text x="40" y="392" class="t-label b" data-w="102">deny-list hook</text>
<text x="40" y="416" class="t-note" data-w="102">still in the code</text>
<rect x="232" y="360" width="232" height="80" rx="8" class="f-purple-soft"/>
<rect x="232" y="360" width="232" height="80" rx="8" class="w1 nofill s-purple-line" data-fit="skip"/>
<text x="248" y="392" class="t-label" data-w="165">the phrases the patterns</text>
<text x="248" y="416" class="t-label" data-w="118">were written from</text>
