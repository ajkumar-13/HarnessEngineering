<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" role="img" aria-labelledby="t d">
  <title id="t">Three defects that survived a passing test suite, and the property each test missed</title>
  <desc id="d">A hand-drawn three-row table of bugs that shipped in this companion despite a green test suite, with columns for the layer, what the test asserted, what it could not see, and the gap between them. Row one, the sandbox allow-list: the tests asserted that it refuses what it should refuse and allows what it should allow, and passed; what they could not see was that the raw string ran through a shell, so one echo could carry a second command. The gap is that the boundary was tested with the traffic you expect. Row two, the tracer span tree: the tests asserted that a run span exists, that iterations nest and that tool spans appear, and passed; what they could not see was every value in the tree, so a sandbox refusal was landing in the ok outcome. The gap is that the tests asserted the shape and never the contents. Row three, the deny-list: the tests asserted the five strings the regular expressions were written from, and passed; what they could not see was that rm space minus fr slash, rm minus r minus f slash and git push minus f are the same commands respelled. The gap is that it was tested with its own source material. A closing pair of lines records that a guardrail's tests have to be adversarial in the same way the guardrail is: asking does this work verifies the feature, asking how would you get past this verifies the boundary, and only the first tends to get written.</desc>

