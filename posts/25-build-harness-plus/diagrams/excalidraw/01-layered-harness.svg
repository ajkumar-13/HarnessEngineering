<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 434" role="img" aria-labelledby="t d">
  <title id="t">Build #2 layers four hardening components onto Build #1</title>
  <desc id="d">A hand-drawn diagram of the four components Build number two adds. A dashed boundary encloses everything and is labelled as the tracer, which turns every run, iteration, model call and tool call into a span. In the centre sits the unchanged Build number one core: the loop, the tool registry and the verification gate. On the left, three gates stack in the order a call passes through them: a hook that blocks before the call runs, deterministically and with no model in the way; an approval gate that pauses the irreversible for a human or a stricter policy; and a sandbox that bounds what a call can reach with an allow-list, a jail and a timeout. Arrows run from each gate into the core. On the right, a fourth component, a sub-agent, is spawned by a delegate tool and runs in its own context window, so the parent sees a result rather than a transcript. A closing line records the order: hook, then approval, then sandbox, blocking the obviously dangerous, escalating the merely sensitive, and bounding the rest.</desc>

