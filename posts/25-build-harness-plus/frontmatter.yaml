title: "25 · Build #2 — add hooks, sandbox, and sub-agents"

description: >
  Build #1 was the honest minimum: a loop that verifies its work and stops for the right
  reason. Build #2 keeps that engine and hardens it, by adding four bounded layers
  (deterministic hooks, an allow-list sandbox, a human approval gate, and one sub-agent),
  all wrapped in tracing.

