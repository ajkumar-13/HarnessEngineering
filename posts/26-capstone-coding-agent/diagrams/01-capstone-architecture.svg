<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-01-capstone-architecture-title" aria-describedby="hrn-01-capstone-architecture-desc">
<title id="hrn-01-capstone-architecture-title">The whole series in one machine, seams marked</title>
<desc id="hrn-01-capstone-architecture-desc">The component map of a harness with the capstone placed on it. At the centre, component 01, the loop, held by driver.py, its three steps reason, act and observe, and cost.py as its budget exit. On the left the four components that feed the model: 02 tools, not shipped; 03 state, held by core.py; 04 context management, held by driver.py; 05 memory, held by memory.py. On the right the four that govern it: 06 verification, held by core.py; 07 hooks and 08 permissions, not shipped; 11 observability, held by observe.py. Below, at a larger scale: 09 orchestration, not shipped, and 10 long-horizon patterns, held by driver.py. Seven components are held; the four seams are drawn dashed with no fill.</desc>
