<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="hrn-02-multi-context-run-title" aria-describedby="hrn-02-multi-context-run-desc">
<title id="hrn-02-multi-context-run-title">Each call starts fresh; the stores carry on</title>
<desc id="hrn-02-multi-context-run-desc">Three generator calls of the capstone's driver on the demo spec, left to right, each a fresh context showing what the driver handed it. Call 1, task add: no report, 0 rules; it writes calc.py and the verdict is fail, drawn red, and the ratchet learns one rule. Call 2, task add: the last report and 1 rule; calc.py, verdict pass. Call 3, task is_even: no report, because the report stays with its task, and 1 rule; parity.py, verdict pass. Below, the state after each call: commits 0, 1, 2; rules held 1, 1, 1; the cost meter at 0.00645, 0.01290 and 0.01935 dollars. The run stops on exit (1), spec complete.</desc>
