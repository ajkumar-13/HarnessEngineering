<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hrn-03-eval-observability-loop-title" aria-describedby="hrn-03-eval-observability-loop-desc">
<title id="hrn-03-eval-observability-loop-title">The model stays fixed; the harness goes round</title>
<desc id="hrn-03-eval-observability-loop-desc">Four cards in a clockwise cycle. The harness runs with the model held fixed and emits a trace. The trace localises the failure to attempt 1 of add, at evaluate, ok=False. An A/B with the model held fixed decides whether a change helps: ratchet on 2 of 2 tasks resolved, ratchet off 0 of 2, both at 0.0193 dollars; a sign test gives p = 0.50, not callable on two tasks. The ratchet keeps the fix: a rule in memory and the failing spec added to the fixed set. An arrow returns to the run with the changed harness.</desc>
